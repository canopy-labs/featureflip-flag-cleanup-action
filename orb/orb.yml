version: 2.1

description: >-
  Remove dead and stale feature flags from a repository hosted on GitHub,
  GitLab or Bitbucket with Featureflip. Each run reads removal candidates
  from your Featureflip project, rewrites the code that reads each flag with
  AST-level transforms, and opens one pull request (or GitLab merge request)
  per flag. No LLM is involved. It runs the same image as the Featureflip
  Flag Cleanup GitHub Action, so the supported languages, safety checks and
  pull requests are identical.

display:
  home_url: https://featureflip.io/docs/integrations/flag-cleanup-action/
  source_url: https://github.com/canopy-labs/featureflip-flag-cleanup-action

executors:
  default:
    description: >-
      A Linux machine with Docker. The cleanup image runs with the checkout
      bind-mounted, which a Docker executor cannot do.
    parameters:
      machine-image:
        type: string
        default: ubuntu-2404:current
    machine:
      image: << parameters.machine-image >>

commands:
  cleanup:
    description: >-
      Run flag cleanup against the checked-out repository in the working
      directory. Needs Docker and a bind mount, so use it on a machine
      executor after `checkout`.
    parameters:
      api-token:
        type: env_var_name
        default: FEATUREFLIP_API_TOKEN
        description: >-
          Name of the environment variable holding your Featureflip API token.
          Store the token in a context or project environment variable. The
          `remove` mode needs the Viewer role, and Member as well to link each
          pull request on its flag. `archive-sweep` needs a separate token with
          the Member role.
      github-token:
        type: env_var_name
        default: GITHUB_TOKEN
        description: >-
          Name of the environment variable holding a GitHub token that can push
          branches and open pull requests on this repository (contents and
          pull requests write). Not needed for a dry run.
      org:
        type: string
        description: Featureflip organization slug.
      project:
        type: string
        description: Featureflip project slug.
      mode:
        type: enum
        enum: ["remove", "archive-sweep"]
        default: remove
        description: >-
          `remove` opens removal pull requests. `archive-sweep` archives flags
          whose removal pull request has merged. The GitHub Action's
          event-driven modes are not offered here, because they read a GitHub
          Actions event payload that CircleCI does not have.
      deployed-refs:
        type: string
        default: ""
        description: >-
          `archive-sweep` only. Refs that must contain a removal before its
          flag is archived. Empty archives on the merge alone.
      api-url:
        type: string
        default: https://api.featureflip.io
        description: Featureflip API origin.
      staleness:
        type: string
        default: dead
        description: Which candidates to fetch, `dead` (ready-for-review pull requests) or `stale` (draft pull requests).
      accessors:
        type: string
        default: ""
        description: >-
          Comma-separated names of your own functions that read a flag, on top
          of the SDK's. Without them a wrapped read is invisible to the run.
      inline-wrappers:
        type: boolean
        default: true
        description: >-
          Inline a Kotlin, Java or C# wrapper whose whole body reads the flag
          being removed (a method, a Kotlin property getter or top-level
          function, or a C# get-only bool property), at every call site that
          is provably bound to it.
      side-effect-free-modules:
        type: string
        default: ""
        description: >-
          Comma-separated TypeScript or JavaScript module specifiers, spelled
          exactly as your imports spell them, whose load does nothing. A
          stranded import of one is deleted rather than kept bare, and the
          pull request names each one.
      side-effect-free-calls:
        type: string
        default: ""
        description: >-
          Comma-separated function or method names whose call does nothing
          you need. A call to one that a removal kept only as a discard
          (`_ = getClient(p)`, `getClient(p);`) is deleted rather than kept,
          and the pull request names each one.
      test-setters:
        type: string
        default: ""
        description: >-
          Go only. Comma-separated names of the functions your tests set a
          flag with (`Set` for `featureflag.Set(org, Flag, true)`). A call
          this tool can prove sets the flag being removed is resolved like a
          mocked read; one it cannot is left in place.
      key-aliases:
        type: string
        default: ""
        description: >-
          Comma-separated `featureflip-key=code-key` entries for code that
          spells a flag's key differently from Featureflip
          (`experimental-agents=experimental.agents`). The removal searches the
          code for the right-hand spelling.
      workspace-packages:
        type: enum
        enum: ["off", "follow"]
        default: "off"
        description: >-
          TypeScript and JavaScript monorepos: `follow` lets an import of
          another package of your repository by name be followed to its
          source. Set it only if no bundler, test runner, Babel plugin or
          loader in your build maps a workspace package to a different
          implementation than its source (see README, "Workspace packages").
      languages:
        type: string
        default: ""
        description: Comma-separated languages to process. Empty means all.
      directories:
        type: string
        default: "."
        description: Comma-separated directories to scan, relative to the checkout.
      ignore:
        type: string
        default: ""
        description: Comma-separated flag keys to skip even when they are removal candidates.
      flags:
        type: string
        default: ""
        description: Comma-separated flag keys to limit the run to. Empty means every candidate.
      base-branch:
        type: string
        default: ""
        description: Branch to open pull requests against. Empty means the repository default.
      pr-labels:
        type: string
        default: ""
        description: Comma-separated labels to add to each pull request.
      max-prs:
        type: integer
        default: 10
        description: Most pull requests to open in one run.
      dry-run:
        type: boolean
        default: false
        description: >-
          Print the diff each flag would get and open nothing. Worth doing on
          the first run.
      repository:
        type: string
        default: ""
        description: >-
          The repository's path: `owner/name` on GitHub, `workspace/name` on
          Bitbucket, `group/sub/project` on GitLab. Empty derives it from the
          CircleCI project.
      github-server-url:
        type: string
        default: https://github.com
        description: GitHub web origin. Change it only for GitHub Enterprise Server.
      github-api-url:
        type: string
        default: https://api.github.com
        description: GitHub API origin. Change it only for GitHub Enterprise Server.
      forge:
        type: enum
        enum: ["github", "gitlab", "bitbucket"]
        default: github
        description: >-
          Where the repository is hosted. On gitlab or bitbucket the change
          requests open there, with `forge-token`.
      forge-token:
        type: env_var_name
        default: FLAG_CLEANUP_FORGE_TOKEN
        description: >-
          Name of the environment variable holding a GitLab project access
          token (`api` scope) or a Bitbucket repository access token
          (`pullrequest:write`, `repository:write`). Ignored on github, which
          uses `github-token`.
      forge-api-url:
        type: string
        default: ""
        description: >-
          Self-managed GitLab only: the API origin, for example
          `https://gitlab.example.com/api/v4`. Set it with `forge-server-url`
          or not at all.
      forge-server-url:
        type: string
        default: ""
        description: >-
          Self-managed GitLab only: the web origin, for example
          `https://gitlab.example.com`. Set it with `forge-api-url` or not at
          all.
      image:
        type: string
        default: ghcr.io/canopy-labs/featureflip-flag-cleanup-action:v2
        description: The cleanup image. Pin a full version or a digest to stop it moving.
    steps:
      - run:
          name: Featureflip flag cleanup
          command: |
            set -euo pipefail

            forge="<< parameters.forge >>"
            repository="<< parameters.repository >>"
            if [ "$forge" = github ]; then
              if [ -z "$repository" ]; then
                if [ -z "${CIRCLE_PROJECT_USERNAME:-}" ] || [ -z "${CIRCLE_PROJECT_REPONAME:-}" ]; then
                  echo "Could not work out the GitHub repository from this pipeline. Set the orb's repository parameter to owner/name." >&2
                  exit 2
                fi
                repository="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
              fi

              server_host="<< parameters.github-server-url >>"
              server_host="${server_host#*://}"
              server_host="${server_host%%/*}"
              case "${CIRCLE_REPOSITORY_URL:-}" in
                "" | *"@${server_host}:"* | *"://${server_host}/"*) ;;
                *)
                  echo "This project is hosted at ${CIRCLE_REPOSITORY_URL}, not on ${server_host}. Flag cleanup opens GitHub pull requests, so it needs a GitHub-hosted repository." >&2
                  exit 2
                  ;;
              esac
            else
              server_host="<< parameters.forge-server-url >>"
              if [ -z "$server_host" ]; then
                case "$forge" in
                  gitlab) server_host=gitlab.com ;;
                  bitbucket) server_host=bitbucket.org ;;
                esac
              fi
              server_host="${server_host#*://}"
              server_host="${server_host%%/*}"
              # An ssh clone URL names the host without the web port.
              ssh_host="${server_host%%:*}"
              url="${CIRCLE_REPOSITORY_URL:-}"
              case "$url" in
                "" | *"@${ssh_host}:"* | *"://${server_host}/"*) ;;
                *)
                  echo "This project is hosted at ${url}, not on ${server_host}. Set forge to where the repository is hosted." >&2
                  exit 2
                  ;;
              esac
              # The path comes from the clone URL, because a GitLab project in
              # a subgroup (group/sub/project) has no CircleCI owner/name form.
              if [ -z "$repository" ]; then
                case "$url" in
                  # ssh://user@host:port/path: the port is not part of the path.
                  *"://"*"@${ssh_host}:"*)
                    repository="${url#*"@${ssh_host}:"}"
                    repository="${repository#*/}"
                    ;;
                  *"@${ssh_host}:"*) repository="${url#*"@${ssh_host}:"}" ;;
                  *"://${server_host}/"*) repository="${url#*"://${server_host}/"}" ;;
                esac
                repository="${repository%/}"
                repository="${repository%.git}"
              fi
              if [ -z "$repository" ]; then
                echo "Could not work out the repository from this pipeline. Set the orb's repository parameter to the project's path." >&2
                exit 2
              fi
            fi

            # Secrets are exported and passed to docker by NAME, so their
            # values never appear in a process's argument list.
            export FEATUREFLIP_API_TOKEN="${<< parameters.api-token >>:-}"
            export GITHUB_TOKEN="${<< parameters.github-token >>:-}"
            export GITHUB_REPOSITORY="$repository"
            export GITHUB_SERVER_URL="<< parameters.github-server-url >>"
            export GITHUB_API_URL="<< parameters.github-api-url >>"
            export FLAG_CLEANUP_FORGE="$forge"
            export FLAG_CLEANUP_REPOSITORY="$repository"
            export FLAG_CLEANUP_FORGE_TOKEN="${<< parameters.forge-token >>:-}"
            export FLAG_CLEANUP_API_URL="<< parameters.forge-api-url >>"
            export FLAG_CLEANUP_SERVER_URL="<< parameters.forge-server-url >>"
            # Only the named forge's variables reach the container: `-e NAME`
            # passes nothing for an unset NAME.
            if [ "$forge" = github ]; then
              unset FLAG_CLEANUP_FORGE FLAG_CLEANUP_REPOSITORY FLAG_CLEANUP_FORGE_TOKEN FLAG_CLEANUP_API_URL FLAG_CLEANUP_SERVER_URL
            else
              unset GITHUB_TOKEN GITHUB_REPOSITORY GITHUB_SERVER_URL GITHUB_API_URL
              [ -n "$FLAG_CLEANUP_API_URL" ] || unset FLAG_CLEANUP_API_URL
              [ -n "$FLAG_CLEANUP_SERVER_URL" ] || unset FLAG_CLEANUP_SERVER_URL
            fi
            export FEATUREFLIP_ORG="<< parameters.org >>"
            export FEATUREFLIP_PROJECT="<< parameters.project >>"
            export FEATUREFLIP_API_URL="<< parameters.api-url >>"
            export FEATUREFLIP_MODE="<< parameters.mode >>"
            export FEATUREFLIP_DEPLOYED_REFS="<< parameters.deployed-refs >>"
            export FEATUREFLIP_STALENESS="<< parameters.staleness >>"
            export FEATUREFLIP_LANGUAGES="<< parameters.languages >>"
            export FEATUREFLIP_ACCESSORS="<< parameters.accessors >>"
            export FEATUREFLIP_INLINE_WRAPPERS="<< parameters.inline-wrappers >>"
            export FEATUREFLIP_SIDE_EFFECT_FREE_MODULES="<< parameters.side-effect-free-modules >>"
            export FEATUREFLIP_SIDE_EFFECT_FREE_CALLS="<< parameters.side-effect-free-calls >>"
            export FEATUREFLIP_TEST_SETTERS="<< parameters.test-setters >>"
            export FEATUREFLIP_KEY_ALIASES="<< parameters.key-aliases >>"
            export FEATUREFLIP_WORKSPACE_PACKAGES="<< parameters.workspace-packages >>"
            export FEATUREFLIP_DIRECTORIES="<< parameters.directories >>"
            export FEATUREFLIP_IGNORE="<< parameters.ignore >>"
            export FEATUREFLIP_FLAGS="<< parameters.flags >>"
            export FEATUREFLIP_BASE_BRANCH="<< parameters.base-branch >>"
            export FEATUREFLIP_PR_LABELS="<< parameters.pr-labels >>"
            export FEATUREFLIP_MAX_PRS="<< parameters.max-prs >>"
            export FEATUREFLIP_DRY_RUN="<< parameters.dry-run >>"

            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              -e FEATUREFLIP_API_TOKEN \
              -e GITHUB_TOKEN \
              -e GITHUB_REPOSITORY \
              -e GITHUB_SERVER_URL \
              -e GITHUB_API_URL \
              -e FLAG_CLEANUP_FORGE \
              -e FLAG_CLEANUP_REPOSITORY \
              -e FLAG_CLEANUP_FORGE_TOKEN \
              -e FLAG_CLEANUP_API_URL \
              -e FLAG_CLEANUP_SERVER_URL \
              -e FEATUREFLIP_ORG \
              -e FEATUREFLIP_PROJECT \
              -e FEATUREFLIP_API_URL \
              -e FEATUREFLIP_MODE \
              -e FEATUREFLIP_DEPLOYED_REFS \
              -e FEATUREFLIP_STALENESS \
              -e FEATUREFLIP_LANGUAGES \
              -e FEATUREFLIP_ACCESSORS \
              -e FEATUREFLIP_INLINE_WRAPPERS \
              -e FEATUREFLIP_SIDE_EFFECT_FREE_MODULES \
              -e FEATUREFLIP_SIDE_EFFECT_FREE_CALLS \
              -e FEATUREFLIP_TEST_SETTERS \
              -e FEATUREFLIP_KEY_ALIASES \
              -e FEATUREFLIP_WORKSPACE_PACKAGES \
              -e FEATUREFLIP_DIRECTORIES \
              -e FEATUREFLIP_IGNORE \
              -e FEATUREFLIP_FLAGS \
              -e FEATUREFLIP_BASE_BRANCH \
              -e FEATUREFLIP_PR_LABELS \
              -e FEATUREFLIP_MAX_PRS \
              -e FEATUREFLIP_DRY_RUN \
              "<< parameters.image >>"

jobs:
  cleanup:
    description: >-
      Check out the repository and run flag cleanup. Trigger it from a
      scheduled pipeline, for example weekly on the default branch.
    executor: default
    parameters:
      api-token:
        type: env_var_name
        default: FEATUREFLIP_API_TOKEN
        description: Name of the environment variable holding your Featureflip API token.
      github-token:
        type: env_var_name
        default: GITHUB_TOKEN
        description: Name of the environment variable holding a GitHub token that can push and open pull requests.
      org:
        type: string
        description: Featureflip organization slug.
      project:
        type: string
        description: Featureflip project slug.
      mode:
        type: enum
        enum: ["remove", "archive-sweep"]
        default: remove
        description: "`remove` opens removal pull requests. `archive-sweep` archives flags whose removal has merged."
      staleness:
        type: string
        default: dead
        description: Which candidates to fetch, `dead` (ready-for-review pull requests) or `stale` (draft pull requests).
      dry-run:
        type: boolean
        default: false
        description: Print the diffs and open nothing.
      image:
        type: string
        default: ghcr.io/canopy-labs/featureflip-flag-cleanup-action:v2
        description: The cleanup image.
      forge:
        type: enum
        enum: ["github", "gitlab", "bitbucket"]
        default: github
        description: Where the repository is hosted.
      forge-token:
        type: env_var_name
        default: FLAG_CLEANUP_FORGE_TOKEN
        description: Name of the environment variable holding the GitLab or Bitbucket token. Ignored on github.
      forge-api-url:
        type: string
        default: ""
        description: Self-managed GitLab only, with `forge-server-url`.
      forge-server-url:
        type: string
        default: ""
        description: Self-managed GitLab only, with `forge-api-url`.
    steps:
      - checkout
      - cleanup:
          api-token: << parameters.api-token >>
          github-token: << parameters.github-token >>
          org: << parameters.org >>
          project: << parameters.project >>
          mode: << parameters.mode >>
          staleness: << parameters.staleness >>
          dry-run: << parameters.dry-run >>
          image: << parameters.image >>
          forge: << parameters.forge >>
          forge-token: << parameters.forge-token >>
          forge-api-url: << parameters.forge-api-url >>
          forge-server-url: << parameters.forge-server-url >>

examples:
  weekly_cleanup:
    description: >-
      Open removal pull requests for dead flags once a week. Add a scheduled
      trigger for this workflow in the project settings, and put
      FEATUREFLIP_API_TOKEN and GITHUB_TOKEN in a context.
    usage:
      version: 2.1
      orbs:
        featureflip: featureflip/flag-cleanup@2
      workflows:
        flag-cleanup:
          jobs:
            - featureflip/cleanup:
                context: featureflip
                org: my-org
                project: my-project
                dry-run: true
  archive_sweep:
    description: >-
      Archive flags whose removal pull request has merged. Archiving needs a
      token with the Member role, so give it its own variable.
    usage:
      version: 2.1
      orbs:
        featureflip: featureflip/flag-cleanup@2
      workflows:
        archive-sweep:
          jobs:
            - featureflip/cleanup:
                context: featureflip
                mode: archive-sweep
                api-token: FEATUREFLIP_ARCHIVE_TOKEN
                org: my-org
                project: my-project
