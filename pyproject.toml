[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flag-cleanup"
version = "1.15.0"
description = "Featureflip Flag Cleanup Action — deterministic dead/stale flag removal via Piranha (runs in the customer's CI)"
readme = "README.md"
license = "Apache-2.0"
# The fork wheel (see the polyglot-piranha entry below) is built for cp312
# specifically, matching the Docker action's python:3.12-slim target — building
# it for another interpreter is a `maturin build` rerun, not a version bump
# here. (PyPI's upstream polyglot-piranha, for reference, ships cp39-cp312
# only as of 0.4.8 — no 3.13/3.14 — which is the other reason this stayed capped.)
requires-python = ">=3.11,<3.13"
dependencies = [
    # Pinned: Piranha rules are tree-sitter-grammar-version-sensitive, so the
    # transform engine must not float. Bump deliberately + re-run the fixtures.
    #
    # 0.8.0, NOT a PyPI release: this is a privately-built engine (tree-sitter
    # 0.27, PyO3 0.29, C# support via tree-sitter-c-sharp 0.23.5) installed
    # from a wheel placed in wheels/ before the build (the Dockerfile
    # bind-mounts it; CI fetches it first). A bare `pip install .` anywhere
    # else resolves `polyglot-piranha` from PyPI, which tops out at 0.4.8 and
    # has no C# grammar — so this pin only resolves with the local-wheel path.
    #
    # 0.6.0 added php/ruby/javascript languages, let one language claim several
    # extensions, and shipped TS/TSX and Python cleanup cascades of its own —
    # none of which changes this tool (no `_LANGUAGES` entries for the ones we
    # do not claim; our cascade is reached only through our own edges). What it
    # DID change is the bundled TypeScript grammar, which is why
    # tree-sitter-typescript below is pinned to a matching build rather than a
    # PyPI range.
    #
    # 0.7.0 moves the engine's own tree-sitter core 0.25 -> 0.27 and fixes two
    # Kotlin built-ins this tool had to work around — the dead trailing
    # `else if` that deleted the live branch ahead of it (piranha#32) and the
    # unbraced-slot variant (#33). The refusal in `kotlin_sentinel` is gone
    # with them; `tests/fixtures/kt/dead_end_else_if` is now a positive case
    # and pins the fix. Every bundled GRAMMAR version is unchanged from 0.6.0
    # (verified against the fork's `crates/core/Cargo.toml`), so none of the
    # grammar pins below had to move with it.
    #
    # 0.8.0 registers Dart as a built-in with its own cascade (piranha#70/#71)
    # — inert here, since `_LANGUAGES` does not claim `.dart` and a built-in is
    # only ever reached through our own edges — and makes three refusals the
    # engine previously did not make. Only one of them is reachable from this
    # tool, and it is a corruption fix rather than a nicety: #68 stops the
    # Kotlin inline from rewriting a name that is bound a SECOND time in scope,
    # which until now emitted `for (true in items)` and `{ true -> … }` to
    # disk. kotlin-ng parses `true` as an `identifier`, so no ERROR node
    # appeared and Gate 1 could not see it — `tests/fixtures/kt/shadowed_binding`
    # pins the fixed behaviour and fails against a 0.7.0 wheel. (#69 refuses a
    # rewrite rule whose edit reproduces its own input, which used to hang the
    # engine; #67 keeps every statement of a promoted Ruby `else`, and Ruby is
    # not a language this tool claims.) Bundled grammar versions are again
    # unchanged apart from the new tree-sitter-dart, so no pin below moved.
    #
    # 0.9.0 fixes three SILENT residues, and all three are reachable from here
    # because Ruby and Dart delegate their cleanup wholesale to the engine's
    # built-ins. Each left the flag key GONE from the file while the guard it
    # fed stayed standing, so the next run saw a clean removal and never
    # revisited: a top-level Ruby binding was never inlined (piranha#79, the
    # `config.ru`/initializer/`Rakefile` shape); a Ruby read compared against a
    # boolean literal stalled at `if true == true` (#78); and a Dart local
    # named with one of the seventeen built-in identifiers the grammar wraps in
    # an unnamed token was never counted as a binding, so its declaration
    # survived (#77). `tests/fixtures/ruby/{top_level_flag,compared_to_literal}`
    # and `tests/fixtures/dart/builtin_identifier_name` pin the three, and all
    # three fail against a 0.8.0 wheel.
    #
    # The fourth change, #76, is a GRAMMAR fix rather than an engine one, and
    # it is the reason the tree-sitter-typescript pin below moved in the same
    # commit: the engine's TypeScript fork went from `a491d96` to `f65cc11`, so
    # leaving Gate 1 on the old wheel would have re-opened the exact parity gap
    # that pin exists to close. Measured while the two were apart — the gate
    # errored on four of six `accessor` shapes the engine parsed, and the ERROR
    # spans re-partitioned across the edit whenever the read sat inside a
    # member named `accessor`.
    #
    # 0.11.0 adds `erb` as a language and changes NOTHING this tool already
    # relied on: the manifest diff between the two tags is the workspace version
    # plus one new crates.io dependency (`tree-sitter-embedded-template`), with
    # no grammar git rev moved, so the tree-sitter-typescript pin below stays at
    # `+canopy.3`. That check is the one worth repeating on every bump rather
    # than comparing grammar version numbers, which read as clean for 0.10.0
    # while its TypeScript fork had in fact moved.
    #
    # 0.12.0 (piranha#90) is the release that makes claiming `.erb` worth
    # doing, and the manifest diff against 0.11.0 is the workspace version and
    # nothing else -- no grammar moved, so the tree-sitter-typescript pin below
    # stays at `+canopy.3` for the same check described above. It fixes the
    # `elsif` reconstruction gap: a read in an `elsif` rung with a LIVE rung
    # after it made the engine refuse the promotion, so the file came back
    # byte-identical on the treatment that should have cleaned it -- a green
    # run that silently does nothing for half a repository's flags, which is
    # worse than a refusal because nothing says so. Re-measured against a
    # 0.11.0 wheel while writing `tests/fixtures/erb/dead_elsif`, so that
    # fixture fails against one; the oracle is `.rb`, since the same shape in
    # plain Ruby and in a template must reach the same decision.
    #
    # `.erb` IS claimed as of this bump. The Gate 1 question that held it is
    # answered in `syntax.py`: the profile parses the TEMPLATE grammar and the
    # host-language checks judge a derived code view under Ruby's profile. A
    # gate pointed at a bare Ruby grammar reads a template's markup as damage
    # -- measured, 22 false refusals over 324 real engine runs and zero true
    # positives.
    #
    # 0.10.0 is the same shape again, and for the same reason the pin below goes
    # to `+canopy.3` in this commit: piranha#86 moved the engine's TypeScript
    # fork from `f65cc11` to `dbac36b`, which parses `f<typeof import('m')>()`
    # and `f<import('m')>()` — the first is the Vitest
    # `importOriginal<typeof import('…')>()` idiom, and both were ERRORs before.
    # Under `--on-parse-error abort` (the default) one such file failed the whole
    # invocation, so this is a file the tool could not touch at all rather than a
    # residue it left behind. Both sides are now `dbac36b`.
    #
    # 0.13.0 (piranha#92) upstreams the three TypeScript cleanup deltas this
    # tool had been carrying downstream: `simplify_await_true` /
    # `simplify_await_false`, and eight widened queries that now match a
    # boolean literal OR that literal wrapped in parentheses. The manifest
    # diff against 0.12.0 is the workspace version and nothing else -- no
    # grammar rev moved -- so the tree-sitter-typescript pin below stays at
    # `+canopy.3`, by the same check described for 0.11.0 above.
    #
    # This bump on its own changes NOTHING observable, and landing it alone is
    # the point: `rules/ts.toml` still declares its own copies of those rules,
    # and a user rule WINS a name collision against a built-in, so every
    # rewrite still runs downstream code. A green suite here says the engine
    # swap is clean; deleting the shadowing copies is then the only thing
    # under test in the commit that follows.
    #
    # 0.14.0 (piranha#94) is the php/ruby half of the same parenthesis defect,
    # and it lands here as a PURE ENGINE FIX -- neither `php.toml` nor
    # `ruby.toml` declares a rule the engine also declares (checked by name:
    # 4 ours vs 34 engine, 3 vs 54, zero collisions), so these two delegate
    # their whole cascade to the built-ins and a pin move is the entire
    # downstream change. The manifest diff against 0.13.0 is the workspace
    # version and nothing else -- no grammar rev moved -- so the
    # tree-sitter-typescript pin below stays at `+canopy.3`.
    #
    # What it fixes: a fold replaces the flag READ, so the literal lands inside
    # whatever parentheses the source already had for precedence, and
    # `($f || $other) && $other` stalled at `(true) && $other` -- a dead guard
    # that still reads as live, which is worse than a refusal because nothing
    # says so. The issue (#3021) named two shapes; probing every literal
    # position found FOUR stalling in php and THREE in ruby. Both operand
    # positions needed widening, not just the left: `&&` binds tighter than
    # `||`, so a disjunction demands parentheses on either side of a
    # conjunction. Ruby's own `!` and ternary rules already alternated over
    # `parenthesized_statements`, which is exactly why `!(...)` folded
    # correctly there while `&&` did not.
    #
    # 0.15.0 (piranha#97) is the PYTHON half of the same parenthesis defect,
    # and unlike the php/ruby half it is NOT a pin move on its own -- see
    # `python_fold._literal_condition`, which had the identical blind spot one
    # layer down and is fixed in the same commit. The engine covers the
    # expression positions and the `if`/`elif` it can already reach; the
    # post-pass covers the three rewrites the engine calls impossible (a
    # multi-statement branch, a sole-statement `if`, and `elif True:` ->
    # `else:`). Each half was verified load-bearing by reverting it alone and
    # watching `tests/fixtures/python/paren_group_fold` go red. The manifest
    # diff against 0.14.0 is the workspace version and nothing else -- no
    # grammar rev moved -- so the tree-sitter-typescript pin below stays at
    # `+canopy.3`.
    #
    # It reaches FURTHER than php and ruby did, and the reason is grammatical
    # rather than a longer list: parentheses are OPTIONAL around a python
    # condition rather than part of the syntax, so `if (flag):` and
    # `elif (flag):` are shapes real code writes and there is a STATEMENT
    # position to widen that neither prior language had. The issue (#3028)
    # named four shapes; probing every literal position found TWELVE.
    #
    # The oracle is PARITY WITH THE BARE FORM in both directions, not "folds as
    # far as possible" -- which is where the issue's own expectations were
    # wrong. `other and (True)` stays exactly as `other and True` stays: the
    # engine deliberately refuses `x and True` -> `x`, because that changes the
    # produced VALUE whenever `x` is falsy-but-not-False. A parenthesis does not
    # suspend a non-goal, and the fixture pins both directions.
    #
    # Known boundary, shared with php and ruby since 0.14.0 and confirmed
    # against that wheel rather than assumed: one alternation arm sees ONE level
    # of parentheses, so `((True)) and other` still stalls. A doubly-
    # parenthesised flag read is not a shape real source contains, and the
    # `if`/`elif` half is covered anyway because the post-pass unwraps in a loop.
    #
    # 0.16.0 (piranha#99) ports fixes that had landed in one language to the
    # siblings that had the same defect: Swift `!( … )`, condition lists,
    # free-function inline and a refusal to inline a name bound twice;
    # literal-vs-literal comparisons for go, php and cs; pattern guards for cs,
    # java and python; splice-or-keep-block for java, cs, dart and go. One
    # change needs a downstream half: in kt and swift a surviving branch that
    # declares a name is left as a literal `if` (neither has a bare block to
    # keep its scope in), and `syntax.py`'s residue gate now refuses that rather
    # than shipping it with the flag key gone. No grammar rev moved, so the
    # tree-sitter-typescript pin below stays at `+canopy.3`.
    #
    # 0.16.1 (piranha#101), not 0.16.0: 0.16.0 anchored Swift's
    # `guard_always_true` in a shape that cost ~18s per run, so every Swift
    # removal took ~20s instead of ~2s. Measured on every Swift fixture here;
    # 0.16.1 is back to 0.15.0's times.
    #
    # 0.16.2 (piranha#103, #104). Swift: an `if` whose then-block is EMPTY
    # used to have its branches swapped in both treatments, and the output
    # parsed, so no gate here saw it. It now folds correctly, and the shapes
    # the engine declines (a comment-only then-block, an empty `else`) are
    # left as a literal `if`, which the residue gate refuses.
    # Java/Kotlin: a boolean-initialised field is deleted only when it is
    # private. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.16.3 (piranha#106). Java: a private field is deleted only when its
    # class is top-level. A private member of a nested, local or anonymous
    # class is visible to the enclosing class (`settings.on`), which the
    # class-scoped rewrite never reaches, so the field is kept as the literal.
    # No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.17.0 (piranha#108). Two engine aborts that refused the whole file:
    # Dart `while (read)` / `do … while (read)` lost the parentheses the
    # statement requires, and a Go package-level `var x = <read>` panicked
    # looking for an enclosing function (it is now folded and kept, since the
    # binding is package-visible). Swift: a trailing `else if <read>` keeps
    # its branch's braces on true and takes its `else` with it on false, using
    # the release's new span capture.
    # Python and Dart fold `await <literal>`. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.17.1 (piranha#111). The engine's tree-sitter-dart is now the
    # canopy-labs fork `v0.2.0-canopy.1`. An arrow function's body extends past
    # its postfix selectors, so a read at the end of a lambda is the lambda's
    # body. Under stock 0.2.0, `(i) => client.boolVariation(...)` parsed as
    # `((i) => client).boolVariation(...)` and the seed rule replaced the whole
    # lambda. That was worked around by a pre-pass that parenthesised those
    # reads before the engine ran. The pre-pass is gone, and the reads reach
    # the engine as written. Only the Dart rev moved, and Dart's Gate 1 grammar
    # comes from PyPI, so `+canopy.3` stays.
    #
    # 0.17.2 (piranha#114). The engine's codebase walk ran on rayon's global
    # pool, which gives up with an error if the walk has not started within one
    # second, and the engine dropped that error. On a loaded runner it saw no
    # files and returned an empty rewrite, so a flag with live reads reported
    # `no-changes`. The walk is now serial, and a walk error fails the run. No
    # grammar rev moved, so `+canopy.3` stays.
    #
    # 0.17.3 (piranha#117). Compiled tree-sitter queries are cached for the
    # life of the process instead of per engine call. Rewrites are unchanged;
    # what changes is cost. Compiling Swift's rules was ~2.7s of every Swift
    # call and is now paid once per process, and every other language skips
    # its recompile too. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.17.4 (piranha#119). The TS cascade folds `true ?? x` / `false ?? x` to
    # the literal (TS2869 otherwise), rewrites `for (init; true; update)` to
    # `for (init; ; update)` and `do B while (true);` to `while (true) B`, the
    # two constant loops `no-constant-condition` rejects. `syntax` treats a
    # condition-less `for` as infinite for that reason. No grammar rev moved,
    # so `+canopy.3` stays.
    #
    # 0.17.5 (piranha#127). The JSX container cleanup a folded gate leaves
    # behind (`{(<Panel />)}`, `{<Panel />}`, `{false}` in child position) is
    # now a built-in, loaded by the `tsx` and `javascript` arms and not by
    # `typescript`. The rules carry the same names as the downstream copies
    # they replace, so those were deleted in the same change: a user rule wins
    # a name collision, and keeping them would have shadowed the engine's. No
    # grammar rev moved, so `+canopy.3` stays.
    #
    # 0.18.0. The engine re-indents the text a fold splices, so the pass that
    # used to restore it here was deleted in the same change. Two engine-side
    # differences reach the output: the blank line a removed closer left
    # behind is gone, and Ruby's dead-code-after-`return` cleanup now reaches
    # bodies it did not before, keeping heredoc bodies and a method's
    # `rescue`/`ensure`/`else`. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.19.0. The engine folds Go's tagless `switch { case <literal>: … }`
    # itself: a `false` arm is deleted, the arms below a `true` arm go, and the
    # `true` arm is promoted to `default:` (or, first, collapsed to its body).
    # It declines on `fallthrough`, a labeled `break`/`continue` or `goto`, an
    # initializer, a `default` above the true arm, and a collapse whose body
    # declares anything or holds a `break`; the residue gate still refuses
    # those. So the Go post-pass that used to finish this was deleted in the
    # same change. The engine also folds the TypeScript family's
    # `switch (true)`, but not yet a read in the SUBJECT or `switch (false)`, so
    # the TypeScript post-pass stays until it does. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.20.0. The Python built-ins fold every literal `if`/`elif` shape,
    # multi-statement branches included, so the post-pass that finished those
    # folds here was deleted in the same change. Only the literal inlining of a
    # bound read stays here, because it needs the whole file. No grammar rev
    # moved, so `+canopy.3` stays.
    #
    # 0.21.0. Three engine-side differences reach the output, all whitespace:
    # deleting a file's first statement takes the line break after it, so the
    # file no longer starts with one extra blank line; a fold keeps the blank
    # lines between the statements it moves; and two statements that shared a
    # line stay on it. It also unwraps a TypeScript `do … while (false)`,
    # deletes a label nothing jumps to and an emptied `static {}` block, and
    # substitutes rule templates in one pass. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.22.0. The engine folds PHP's `switch (true)` multi-way guard itself: a
    # `false` arm is deleted, the arms below a `true` arm go, and the `true`
    # arm is promoted to `default:`. It declines when an arm but the last can
    # fall through (a braced body counts as one that can), a `goto` label sits
    # in the switch, or a `default` is above the true arm; the residue gate
    # still refuses those. So the PHP post-pass that finished this was deleted
    # in the same change; the `if`/`elseif` fold stays. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.23.0. The engine folds Ruby's subject-less `case` itself: a `when
    # false` is deleted, a first `when true` collapses the `case` to its body,
    # and a later one becomes the `else`, taking the arms below it. In
    # expression position (`x = case … end`) it collapses only a single simple
    # expression and otherwise declines, as it does for `when a, b` and for the
    # only `when` of a `case` that keeps an `else`; the residue gate refuses
    # those. So the Ruby post-pass that finished this was deleted in the same
    # change. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.24.0. The engine folds Kotlin's subject-less `when` itself: a `false ->`
    # arm is deleted, a first `true ->` arm collapses the `when` to its body
    # where the body can stand in its place, and any other `true ->` arm
    # becomes the `else`, taking the arms below it. It declines an arm listing
    # several conditions and the only arm of a `when` that is not a statement
    # of a block; the residue gate refuses those. So the Kotlin post-pass that
    # finished this, and the shared fold helper it was the last user of, were
    # deleted in the same change. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.25.0. Four Ruby changes and one ERB change reach the output. A folded
    # `if`/`unless` is unwrapped by where it stands: in a statement list any
    # branch replaces it, in value position only one simple expression does,
    # and the engine declines the rest instead of splicing them in wrong
    # (`x = if true; a; b end` used to become `x = a` plus a loose `b`). Those
    # declines leave a literal condition, so the residue gate now counts
    # Ruby's `if`/`unless`/`elsif` conditions and refuses them. A dead branch
    # that was a method's or block's last statement becomes `nil`, keeping
    # what it returns; the dead-loop rules gained twins for that, which
    # `_ENGINE_DEAD_LOOP_RULES` lists. No built-in Ruby rule is a seed any
    # more, so a callback condition (`if: -> { true }`) or an empty RSpec hook
    # the customer wrote is left alone, and only one a fold produced goes. In
    # ERB, a tag the cascade rewrote comes back as one tag whatever blank lines
    # it held. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.26.0 and 0.27.0. In Go the engine deletes the locals and imports its
    # own fold stranded: a local is deleted or discarded to `_ = v`, a header
    # name becomes `_` or goes, and an import goes when nothing in the file
    # reads it. An unaliased import is deleted only through a per-file fact
    # naming the package it binds, which `piranha_runner` passes from
    # `unused.go_import_facts`. Those removals are read back by rule name and
    # reported as the text pass's are; that pass still runs after, for what
    # the engine withholds and for strands this side's own edits make. 0.27.0
    # makes a removed import leave gofmt's output, taking its comments and the
    # blank lines it would strand, which the text pass used to tidy for it. It
    # also keeps a side-effecting left operand of `x || true` / `x && false`,
    # and leaves string literals alone when collapsing blank lines. No grammar
    # rev moved, so `+canopy.3` stays.
    #
    # 0.28.0. Fold soundness in eight languages, each a rewrite that changed
    # what the code did. Go withholds an inline when another binding shares the
    # name (`go_inline` still refuses a read of an outer variable above the
    # local's declaration, which the engine cannot see), splits a two-name
    # declaration (the `split_*` pair, added to `_GO_INLINE_RULES`), and deletes
    # what follows a folded jump in a block or clause. Ruby and Swift inline a
    # local only when its one write reaches every read, and Ruby replaces a
    # value-position write by its value. C# keeps `out`/`ref` locals and a local
    # function after a `return`; C# and Java delete a later arm a `when true`
    # dominates. TS keeps a comment's `else` statement, parenthesises an arrow
    # body's object literal and declines a dead branch holding a `var`. Kotlin
    # declines a multi-statement value-position `if` and folds `this.prop`;
    # Dart keeps an unbraced `if` body; PHP casts a kept operand to `(bool)` in
    # a value position. A comment after a folded `}` trails the moved body, and
    # an ERB tag takes what its trim markers trimmed. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.29.0. More fold soundness. TS moves code that followed a spliced body
    # ending in a line comment onto a line of its own, and keeps a folded
    # callee or `delete` operand unbound as `(0, obj.m)`. Ruby's `replace_not_*`
    # rules need a real `!`/`not`, a local read by `defined?` is not inlined, a
    # `case` whose only `when` is the read collapses to its `else` on false,
    # and a right-literal `&&`/`||` keeps the literal where the value is read.
    # Swift folds a false `if` expression. Java folds `this.field` whole when
    # the field is provably the class's own. No grammar rev moved, so
    # `+canopy.3` stays.
    #
    # 0.30.0. A TS/JS callee folded to a plain name loses its parentheses,
    # `other()`, because TypeScript's CommonJS output turns `(other)()` into a
    # call bound to the module object. `delete` of a folded plain name keeps
    # `(0, x)`, since `delete (x)` is a strict-mode syntax error. No grammar
    # rev moved, so `+canopy.3` stays.
    #
    # 0.31.0. Go's stranded-local deletes take a trailing `// comment` with
    # the line, and cover a two-name declaration and a binding nothing reads;
    # the new rule names are in `_ENGINE_STRANDED_LOCAL_RULES`. Kotlin and Dart
    # rewrite a `$name` template to `${literal}` and inline a local only when
    # every use lies inside its block after the declaration; a Kotlin private
    # property read bare from a lambda, extension, object expression or nested
    # class, or shadowed by a constructor parameter, is kept. Dart counts
    # untyped, field and super formals as bindings and deletes a dead
    # collection `for`. PHP folds a brace-less `if`, guards a dangling `else`,
    # drops dead `match(true)` arms and parenthesises for precedence. Scope is
    # resolved by position, not by the first twin with the same signature. No
    # grammar rev moved, so `+canopy.3` stays.
    #
    # 0.32.0. Ruby's engine deletes the locals its own fold stranded, as Go's
    # does: an inert `x = v` goes with the comment on its line, and a call
    # keeps `v` as a statement. The two rule names are in
    # `_ENGINE_STRANDED_LOCAL_RULES`, and `unused.py`'s Ruby branch stays as the
    # backstop for what the engine withholds. Go is unchanged. No grammar rev
    # moved, so `+canopy.3` stays.
    #
    # 0.33.0. Dart's engine deletes the locals its own fold stranded, as Go's
    # and Ruby's do: an inert value (or none) goes with the comment on its
    # line, and a call, constructor or `await` keeps its value as a statement.
    # The two rule names are in `_ENGINE_STRANDED_LOCAL_RULES`, and
    # `unused.py`'s Dart branch stays as the backstop for what the engine
    # withholds. A blank line a deletion leaves just inside its container
    # (after the opening delimiter, or before the closing `}`/`end`) is
    # removed, except in Go and ERB. A file that was CRLF throughout stays
    # CRLF through deletions and folds, so `_collapse_carriage_returns` no
    # longer finds the doubled `\r` there; it stays as defence in depth. No
    # grammar rev moved, so `+canopy.3` stays.
    #
    # 0.34.0. The engine's C# grammar is canopy-labs/tree-sitter-c-sharp
    # bc21c68 (upstream 0.23.5 plus one scanner fix): after an escaped `{{` in
    # an interpolated string the next `{` opens a hole, so `$"{{{x}}}"` reads
    # `x` as an expression instead of string text. C# moved, so its Gate 1
    # grammar moves with it to `tree-sitter-c-sharp==0.23.5+canopy.1` (see
    # that entry). TypeScript's rev did not move, so `+canopy.3` stays.
    #
    # 0.35.0. Python's and PHP's engines delete the locals their own fold
    # stranded, as Go's, Ruby's and Dart's do: Python an `x = <literal>`
    # statement, PHP a `$x = <literal>;` and a one-clause `use` nothing else
    # names. The three rule names are in `_ENGINE_STRANDED_LOCAL_RULES` and
    # `_ENGINE_STRANDED_IMPORT_RULES`, and `unused.py`'s Python and PHP
    # branches stay as the backstop. Ruby's engine rules now cover block
    # locals, an only `||=`/`&&=` of a literal, and a body's last `x = v`,
    # which becomes `v`; they withhold a literal that raises (`~1.5`,
    # `1..'a'`) or an endless range Ruby would continue onto the next line,
    # and `unused.py` withholds the same. A deleted statement takes
    # the comment after it on its line, code after it on that line keeps a
    # line of its own, and deleting a last clause (`elif`, `else`, `finally`)
    # keeps the blank lines after it. No grammar rev moved, so `+canopy.3`
    # stays.
    #
    # 0.36.0. Swift's, Java's and Kotlin's engines delete the locals their
    # own fold stranded: Swift a `let`/`var x = <literal>` in a function,
    # Java a `T x = <literal>;` in a block, Kotlin a `val`/`var x =
    # <literal>` in a block or lambda. Java's and Kotlin's also delete an
    # import whose name the file no longer spells; Kotlin's takes an aliased
    # import only when neither the alias nor the original name is spelled.
    # The five rule names are in `_ENGINE_STRANDED_LOCAL_RULES` and
    # `_ENGINE_STRANDED_IMPORT_RULES`, and `unused.py`'s three branches stay
    # as the backstop. No grammar rev moved, so `+canopy.3` stays.
    #
    # 0.37.0. C#'s and TypeScript/TSX/JavaScript's engines delete the locals
    # their own fold stranded: C# a `var`/predefined-type `x = <literal>;` in
    # a block, TS/JS a `const`/`let`/`var x = <literal>` in a block. TS/JS
    # also deletes one named import specifier the file no longer spells, but
    # never a group's last one, and never in a file holding `</` or `/>` or
    # spelling `eval`. The five rule names are in
    # `_ENGINE_STRANDED_LOCAL_RULES` and `_ENGINE_STRANDED_IMPORT_RULES`, and
    # `unused.py`'s C# and TS branches stay as the backstop. No grammar rev
    # moved, so `+canopy.3` stays.
    #
    # 0.38.0. The engine's tree-sitter-dart is upstream 0.3.0 from crates.io
    # again, not the canopy-labs fork: upstream shipped its own fix for the
    # arrow-body tail the fork carried. 0.3.0 renamed node kinds, so the
    # engine-side Dart rules here moved with it (`class_member` is now
    # `member_declaration` in `dart_const.toml` and `dart_ctor_param.toml`,
    # `pair` is `map_element` in `dart_entries.toml`). Everything that parses
    # with Gate 1's PyPI 0.1.0 grammar keeps the 0.1.0 names, which did not
    # change. One output change: a local read as `'$x\$'` used to be lexed
    # as the name `x\$`, so the fold left that read behind and Gate 1 refused
    # the file; now it folds to `'${true}\$'` (`dart/short_template`). No
    # TypeScript or C# grammar rev moved, so `+canopy.3` and `+canopy.1` stay.
    "polyglot-piranha==0.38.0",
    # Featureflip public API client (removal-candidates fetch). Floated on
    # major version only — this tool has no other httpx-version-sensitive
    # surface to pin against.
    "httpx>=0.27,<1",
    # Reads GitHub Actions workflows to find which projects a pack step packs
    # (csharp_workflows.py). safe_load only. Also used by the packaging tests.
    "pyyaml>=6",
    # Backs the two safety gates in flag_cleanup.ts_syntax (post-transform parse
    # check + pre-flight shadow check). Pure wheels, no Node in the action image.
    # Grammar-version-sensitive like polyglot-piranha, so capped on minor.
    "tree-sitter>=0.23,<0.26",
    # One grammar per supported language — each backs the SAME post-transform
    # parse check, so a language without its grammar would have no Gate 1 at
    # all. Capped on minor for the same reason as tree-sitter itself: a grammar
    # bump can rename node types, and the gate's checks name some of them.
    # TypeScript/TSX. NOT a PyPI release, and pinned EXACTLY for the same
    # reason tree-sitter-c-sharp is: Gate 1 must see the same node shapes the
    # engine rewrites against. polyglot-piranha bundles upstream 0.23.2 plus
    # THREE grammar patches, and this wheel is cut from the same commit the
    # engine pins so the pair cannot drift:
    #
    #   a491d96  a bare `&` in JSX text (`<p>Terms & Conditions</p>`, which
    #            `tsc` accepts) parses for the engine and ERRORS for stock
    #            0.23.2 on PyPI.
    #   f65cc11  `accessor` composes with `static`/`abstract`/`override`, and a
    #            class member may be NAMED `accessor` (plain ECMAScript, so a
    #            `.js` file is enough to hit it). Arrived with piranha 0.9.0's
    #            #76; the wheel moved with it, which is the whole reason the
    #            local segment went to `canopy.2`.
    #   dbac36b  `f<typeof import('m')>()` and `f<import('m')>()` parse as type
    #            arguments rather than as a `<` comparison. Arrived with piranha
    #            0.10.0's #86, taking the local segment to `canopy.3`. Only
    #            `import` was affected, and only in FIRST position: the grammar
    #            ranked `call_expression` above the type-side rule in
    #            `precedences`, and a reduce/reduce conflict is settled by
    #            precedence before any declared conflict is consulted.
    #
    # When the two disagree, tree-sitter's error recovery re-partitions across
    # a rewrite and Gate 1's stranded-keyword and ASI-fusion checks read that
    # shift as damage -- refusing a correct rewrite, which is flag-wide and so
    # abandons the whole flag on every run. Measured: 1 of 8 realistic bare-`&`
    # shapes under stock; and with the engine on `f65cc11` while the wheel was
    # still `a491d96`, the gate errored on 4 of 6 `accessor` shapes the engine
    # parsed and the ERROR spans re-partitioned across the edit whenever the
    # read sat inside a member named `accessor`.
    #
    # The local segment is what makes this pin safe: PyPI forbids local
    # versions, so it can NEVER be satisfied silently by upstream's
    # identically-numbered 0.23.2 -- it resolves only from wheels/, filled by
    # scripts/fetch_piranha_wheels.py. The GRAMMAR version stays 0.23.2 across
    # all three patches, so the segment is the only thing that distinguishes the
    # builds: bump it whenever the engine's pinned commit moves. Verified
    # against stock across 52 constructs: 9 fixed, 43 identical, 0 made worse.
    "tree-sitter-typescript==0.23.2+canopy.3",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-swift>=0.7,<0.8",
    "tree-sitter-kotlin>=1.1,<2",
    "tree-sitter-python>=0.23,<0.26",
    # PHP. Capped on minor like the others. NOT pinned exactly to what the
    # engine bundles, and it cannot be: the engine pins tree-sitter-php 0.24.2
    # while PyPI tops out at 0.24.1, so an `==` pin would be unresolvable.
    #
    # The version gap is not the thing that matters — the NODE NAMES are, and
    # they were verified to agree rather than assumed: every node this tool's
    # rules and Gate 1 profile name (`member_call_expression`,
    # `function_call_expression`, `name`, `string`, `encapsed_string`,
    # `string_content`, `arguments`, `argument`, `boolean`, `else_if_clause`,
    # `parenthesized_expression`, `compound_statement`) was read off the 0.24.1
    # wheel's parse tree and then compiled and matched INSIDE the 0.6.0 engine.
    # A query naming a node the engine's grammar lacks fails loudly at
    # query-compile time (`QueryError { kind: NodeType }`), which is how the
    # `(false)`-vs-`(boolean)` difference was caught — so this skew cannot rot
    # silently the way the TypeScript one did (see the grammar-parity section
    # in CLAUDE.md; that one diverged in error RECOVERY, which no query names).
    "tree-sitter-php>=0.24.1,<0.25",
    # Ruby. Pinned EXACTLY, like tree-sitter-c-sharp and unlike the PHP entry
    # above: the engine's `crates/core/Cargo.toml` reads `tree-sitter-ruby =
    # "0.23.1"` and PyPI's top version is the same, so there is no skew to
    # reason about. Gate 1 must see the same node shapes the engine rewrites
    # against.
    "tree-sitter-ruby==0.23.1",
    # ERB. Pinned EXACTLY, on the same argument as the Ruby entry above and
    # with the same absence of a catch: the engine's `crates/core/Cargo.toml`
    # reads `tree-sitter-embedded-template = "0.25.0"` and PyPI's top version
    # is the same, so there is no skew to reason about and none can appear
    # without someone choosing it. That is the property
    # `tree-sitter-typescript==0.23.2+canopy.N` buys the hard way — a private
    # fork, a release, a local version segment and a fetch script — and this
    # one gets free.
    #
    # Exactness matters more here than for a grammar Gate 1 merely differences.
    # `.erb`'s CODE VIEW is built by collecting every node named `code`, so a
    # rename in this grammar does not produce a wrong answer, it produces an
    # EMPTY view — and an empty view is clean Ruby on both sides of every
    # differential, so all three checks that consume it would go quietly
    # vacuous. (`test_every_profile_names_node_types_its_own_grammar_has`
    # asserts the view is non-empty for exactly that reason.) The engine builds
    # its own view from the same grammar, so the two must not drift either.
    #
    # It backs `.erb`'s Gate 1, which is the first profile here whose grammar
    # is not the language its rules are written for: the STRUCTURE is judged
    # with this grammar over the real file, and the host-language checks judge
    # a derived code view under Ruby's profile. See `syntax.py`'s `code_view`.
    "tree-sitter-embedded-template==0.25.0",
    # C#. NOT a PyPI release, and pinned EXACTLY for the same reason as
    # tree-sitter-typescript above: Gate 1 must see the SAME node shapes the
    # engine rewrites against, or its checks silently stop matching.
    # polyglot-piranha bundles upstream 0.23.5 plus ONE external-scanner patch,
    # and this wheel is cut from the same commit the engine pins
    # (canopy-labs/tree-sitter-c-sharp bc21c68):
    #
    #   bc21c68  an escaped `{{` left the scanner's brace count at its limit,
    #            so the `{` straight after it could not open a hole:
    #            `$"{{{x}}}"` read `{x}` as string content. With a
    #            string literal in the hole stock 0.23.5 ERRORS; without one it
    #            is no error at all, just a hole whose expression nothing can
    #            see -- a flag read or a key const inside it included.
    #
    # Same local-segment discipline as the TypeScript pin: PyPI forbids local
    # versions, so this resolves only from wheels/, and the segment must move
    # whenever the engine's pinned commit does. The test
    # `test_the_csharp_grammar_matches_the_engines_view_of_escaped_braces`
    # fails if the stock grammar is ever installed instead.
    "tree-sitter-c-sharp==0.23.5+canopy.1",
    # Dart. The ONE grammar here that is NOT the version the engine bundles,
    # and the gap is a whole restructuring rather than a skew: the engine pins
    # `tree-sitter-dart 0.3.0` (0.2.0 until engine 0.38.0: a conventional
    # `call_expression` / `member_expression` grammar that exposes string
    # content as `template_chars_*`), while 0.1.0 is the only release on PyPI and models a
    # call as a flat selector chain exposing NO node for a string's content at
    # all. A rule written for one matches nothing under the other.
    #
    # It is pinned exactly anyway, and it is sound, because GATE 1 ASKS A MUCH
    # SMALLER QUESTION THAN THE RULES DO — only "did the error count rise" and
    # "did a keyword land in a name position", neither of which looks at a call
    # or a string. Measured rather than assumed: 1,310 real `.dart` files
    # (flutter/samples, localsend, spotube) parse with ZERO error or missing
    # nodes under 0.1.0, matching what piranha#70 measured for 0.2.0, and 36
    # engine rewrites produced zero Gate 1 refusals, zero new parse errors, and
    # zero rejections from the real Dart front end.
    #
    # The durable fix if it ever bites is a canopy-built 0.2.0 wheel, the
    # `tree-sitter-typescript==0.23.2+canopy.3` arrangement — see CLAUDE.md.
    # Capped exactly so that a future PyPI 0.2.0 is a deliberate decision rather
    # than a silent grammar swap under Gate 1.
    "tree-sitter-dart==0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # `-n N` for parallel runs; CI uses `-n 2`. Not in `addopts`, so the worker
    # count stays a choice made per machine. The skip ledger enforces under it.
    "pytest-xdist>=3.5",
    # `action.yml` is parsed, not regexed, by the packaging and wrapper guards:
    # those tests assert a relationship between twelve inputs and twelve env
    # entries, and a regex that drifts with the file's indentation would fail
    # for reasons that have nothing to do with the property under test.
    # (PyYAML itself is a runtime dependency now; see `dependencies`.)
    # The build backend, so `pip wheel --no-build-isolation` needs no network at
    # test time. Same package `[build-system].requires` names; pinned to nothing
    # for the same reason it is unpinned there.
    "hatchling",
]

[tool.hatch.build.targets.wheel]
# Ships the .toml rule files too: they live inside src/flag_cleanup/rules, so
# hatchling's default packaging already includes them. Do NOT add a
# force-include for that directory — it re-adds files this line has already
# added and a non-editable `pip install .` then dies with "A second file is
# being added to the wheel archive at the same path". Invisible to
# `pip install -e .` (what local dev and pytest use), so cover any change here
# with a real wheel build.
packages = ["src/flag_cleanup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "-q", "--strict-markers", "-m", "not nondeterministic"]
markers = [
    # Preserved engine-bug reproductions. Deselected by default: a test whose
    # point is that Piranha answers differently for identical input cannot gate
    # CI. Run with `pytest -m nondeterministic`.
    "nondeterministic: reproduces a Piranha nondeterminism finding",
]
