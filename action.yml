name: 'Featureflip Flag Cleanup'
description: >-
  Deterministically remove dead/stale feature flags from TypeScript, TSX,
  JavaScript, PHP, Ruby, ERB, Dart, Java, C#, Go, Python, Kotlin and Swift
  source
  using
  Featureflip's
  removal-candidates API
  and AST-level source transforms, opening one pull request per flag (draft for
  Stale, ready for review for Dead). No LLM.
author: 'Featureflip'
branding:
  icon: 'trash-2'
  color: 'purple'

inputs:
  api-token:
    description: >-
      Your Featureflip API token, scoped to read removal candidates for
      `org`/`project`. This is YOUR token, not a Featureflip-internal one —
      store it as a repository or organization secret, never as plain text.
    required: true
  org:
    description: 'Featureflip organization slug.'
    required: true
  project:
    description: 'Featureflip project slug.'
    required: true
  mode:
    description: >-
      What this invocation does. `remove` (the default) fetches removal
      candidates and opens one pull request per dead flag — everything this
      Action did before archive-on-merge existed. `archive-on-merge` archives
      the flag whose removal pull request just merged, and does nothing else:
      no checkout, no source is read, no pull request is opened. Merging is not
      deploying, though, and that distinction decides whether this mode is safe
      for you: archiving a flag a deployed build still reads makes every caller
      fall back to the default written at its own call site, which for a
      fully-rolled-out flag turns the feature off. Featureflip refuses such an
      archive while it can still see the flag being evaluated, and this run
      reports `deferred` and exits `0` rather than failing — so where your
      deploys lag your merges, pair this with `archive-sweep` below, which is
      what actually archives the flag once traffic drains. See "Archive the
      flag once the removal is deployed" in the README, including the one case
      neither mode can close: clients you cannot update (mobile, desktop,
      embedded), where evaluations never stop arriving.

      `archive-sweep` re-attempts the archives `archive-on-merge` could not
      finish. Merging a removal pull request is not deploying it, and
      Featureflip refuses to archive a flag live traffic is still evaluating —
      so an `archive-on-merge` run reports `deferred` and exits `0` rather than
      failing. This mode is what comes back for those: on a schedule, it finds
      every flag in the project whose removal pull request merged but which is
      still live, and tries again. Nothing is written anywhere to record a
      deferral — the flag being unarchived IS the record — so re-running is
      harmless and there is no state to reset.

      `archive-on-deploy` archives on the event the removal was actually
      waiting for. Where `archive-on-merge` fires on the merge and usually has
      to defer, this fires on `deployment_status` and archives the outstanding
      flags whose removal the DEPLOYED COMMIT contains — asked of GitHub's
      compare endpoint, not assumed. A deployment to any environment other
      than `deployment-environment` (below) archives nothing and says so, as
      does any status that is not `success`, and a merged removal this deploy
      does not contain is reported `pending-deploy` and left for the deploy
      that ships it. It is an ADDITIONAL pattern, not a replacement: it helps
      only repositories that create GitHub Deployments, and nothing at all for
      clients you cannot update (mobile, desktop, embedded), where old versions
      keep evaluating the flag whatever you deploy. It reads `api-token`,
      `org`, `project`, `api-url`, `deployment-environment` and `dry-run`, and
      ignores every other input below.

      IMPORTANT — `archive-sweep` and `archive-on-deploy` are the archive modes
      that need `GITHUB_TOKEN`. The sweep asks GitHub, once per live flag,
      whether that flag's removal branch ever produced a merged pull request
      (`pull-requests: read`); `archive-on-deploy` asks that too and then
      compares each merge commit against the deployed one (`contents: read` as
      well). Pass the token through in the workflow's `env:` and give the job
      those permissions. Needing a token at all is the cost those two modes pay
      for not firing on the merge event: `archive-on-merge` reads its pull
      request straight out of the event payload, so it needs nothing from
      GitHub, and reads only `api-token`, `org`, `project` and `api-url` —
      `dry-run` included in what it ignores, since it archives exactly the one
      flag its trigger names.

      `pr-command` re-runs the removal for the flag whose pull request a
      comment was left on. It is triggered by `issue_comment` and reads its
      command from the comment body: `@featureflip-cleanup rerun` regenerates
      the diff from the base branch and force-pushes it over the pull
      request's branch, refusing if anyone other than this Action has
      committed to that branch; `@featureflip-cleanup recreate` does the same
      and proceeds over those commits. Only commenters with write access can
      run either. The flag is identified by the pull request's own branch, so
      there is nothing to configure per flag.

      Exit codes in `pr-command` differ from the other two modes, because
      almost every outcome is an ANSWER rather than a failure: `0` covers a
      comment this Action ignores (no command, not a pull request, not
      enough permission, not a branch this Action opened) as well as a
      successful re-run, including one whose diff came back empty
      (`rerun-empty`) and including a dry run (`rerun-dry-run`; see the
      `dry-run` input below for what that mode actually does here). An empty
      diff wins if both apply — a dry run that would have produced nothing
      reports `rerun-empty`, not `rerun-dry-run`. `1` is a refusal (foreign
      commits on the branch, an already-merged pull request, a flag no longer
      a removal candidate, or the flag being in this workflow's `ignore` list
      — `rerun-ignored`) or a raised failure. `2` is the run failing to start
      at all: the workflow wired to something other than `issue_comment`, or a
      checkout this Action cannot work in safely — a `directories` entry that
      is not a git working tree, entries from two repositories, or uncommitted
      changes to tracked files, which a re-run would otherwise commit onto the
      pull request's branch. Nothing is transformed, committed or pushed when
      that fires. See "Re-run a removal from a comment" in the README.

      The five modes are separate workflows on separate triggers, never
      steps of one job. `remove` runs on a schedule; `archive-on-merge` runs
      on `pull_request` with `types: [closed]`; `archive-sweep` runs on a
      schedule; `archive-on-deploy` runs on `deployment_status`; `pr-command`
      runs on `issue_comment` with `types: [created]`.

      IMPORTANT — every archive mode needs a DIFFERENT token. Archiving
      requires the Member role, while fetching removal candidates needs only
      read access. Give those workflows their own secret rather than reusing
      the read-only one, or a leaked token stops meaning "flag names disclosed"
      and starts meaning "flag state changed". In `archive-on-merge` every input
      below except `api-url` is ignored. `pr-command` reads a NARROWER set of
      `remove`'s inputs — the complete list is in the README's "Re-run a
      removal from a comment" section, and the short version is: `api-token`,
      `org`, `project`, `api-url`, `directories`, `languages`, `accessors` and
      `ignore` all apply and must match the workflow that opened the pull
      request, or a re-run regenerates a different diff than the one already
      proposed. `staleness` is NOT on that list: this command looks the flag
      up by the key its branch already encodes and checks both tiers
      regardless of which is configured (the configured one first, then the
      other, so a flag that has moved tiers since the pull request opened is
      still found) — so it never changes the diff, and its only visible
      effect is which tier name this command's own reply happens to quote.
      `dry-run` applies here too — see its own description below for what
      that actually means in this mode, which is
      NOT the same as in `remove` — but it has no bearing on the diff itself,
      only on whether the regenerated result is pushed, so it is deliberately
      not in the "must match" list above. `flags`, `max-prs` and `pr-labels`
      are read but do nothing here — `flags` scopes an ordinary sweep, not a
      re-run of one flag the branch already names; `max-prs` bounds how many
      pull requests a sweep opens, and this mode opens none; `pr-labels` only
      applies when a pull request is first opened. `base-branch` is likewise
      unused, in the other direction: this mode always regenerates from the
      pull request's OWN base branch, never a configured one.
    required: false
    default: 'remove'
  deployment-environment:
    description: >-
      `archive-on-deploy` only: the GitHub deployment environment whose
      successful deployments authorize an archive. A `deployment_status` for
      any other environment is reported and archives nothing, which is what
      keeps a staging or preview deploy from retiring a flag production is
      still reading. Matched case-insensitively against the payload's
      `deployment.environment`, so `Production` and `production` are the same
      environment here — a mismatch would otherwise make the workflow silently
      inert, which reads exactly like having nothing to archive. Ignored by
      every other mode.
    required: false
    default: 'production'
  api-url:
    description: >-
      Featureflip public API origin. Override only for a staging or
      self-hosted instance.
    required: false
    default: 'https://api.featureflip.io'
  staleness:
    description: >-
      Which removal candidates to fetch from the API: `dead` or `stale`.
      `dead` flags open ready-for-review PRs; `stale` flags open draft PRs.
    required: false
    default: 'dead'
  accessors:
    description: >-
      Comma-separated function names your code uses to read a flag, on top of
      the SDK's own. Most codebases wrap the SDK — `useFlag('my-flag')` over a
      typed registry — and without this the wrapper is invisible: every flag
      reports no changes, the run goes green, and nothing says why. Give the
      wrapper's name here and it is matched exactly as an SDK call would be.
      Each name must be a plain function name (`[A-Za-z_][A-Za-z0-9_]*`); the
      run fails immediately (exit 2) otherwise, because these are substituted
      into the rewrite rules. Names are matched by callee name only — a wrapper
      whose flag key is not a literal at the call site still cannot be matched.
    required: false
    default: ''
  languages:
    description: >-
      Comma-separated Piranha languages to run. Leave unset to run every
      language this Action currently supports (`ts`, `tsx`, `js`, `php`,
      `ruby`, `erb`, `dart`, `java`, `go`, `python`, `kt`, `csharp`, `swift` — see README). An unsupported value fails the run immediately (exit 2),
      before
      anything is modified, rather than surfacing deep in the transform engine.
    required: false
    default: ''
  directories:
    description: >-
      Comma-separated directories, relative to the checkout, to scan for
      flag reads. Each must exist and be inside the git checkout; each must
      also have no uncommitted changes to tracked files, since the run undoes
      its own edits between flags and cannot tell those apart from yours.
      Either condition fails the run immediately (exit 2) before anything is
      modified. Both are satisfied by a normal `actions/checkout` step.
    required: false
    default: '.'
  ignore:
    description: >-
      Comma-separated flag keys to skip even if the API reports them as
      removal candidates. Also the way to silence a flag this Action refuses to
      process — an unrepresentable key, or a file whose rewrite fails the
      post-transform syntax check — which otherwise fails the run on every
      future invocation (by design; see "Exit codes" in the README).
    required: false
    default: ''
  flags:
    description: >-
      Comma-separated flag keys this run may propose, as an ALLOWlist. Leave
      unset (the default) to consider every removal candidate. Useful for
      scoping a sweep to one flag, and — with `dry-run: true` — for previewing
      exactly one flag's diff without touching the GitHub API at all.

      This does NOT re-propose a flag that already has a pull request: a flag
      named here is still skipped if one was ever opened for it. To re-run
      against a flag whose pull request is already open or closed, comment
      `@featureflip-cleanup rerun` on that pull request (see `mode`).

      `ignore` wins when a key appears in both lists.
    required: false
    default: ''
  base-branch:
    description: >-
      Base branch each removal pull request targets. Leave unset to use the
      repository's own default branch, looked up once per run — do not assume
      `main`, which silently rejected every pull request in a `master`
      repository. The run also refuses to start (exit 2) if the checkout
      carries commits the base branch does not, since a removal branch is cut
      from the checkout and would otherwise drag them into every PR: run this
      Action from a checkout of the base branch (`on: schedule` or `on: push`),
      not from a `pull_request` merge commit. Read only by `remove` mode —
      `pr-command` regenerates against the pull request's OWN base and makes
      the same containment check against that, but reports it as exit 1, since
      there it is one pull request's problem rather than a broken workflow.
    required: false
    default: ''
  pr-labels:
    description: >-
      Comma-separated labels applied to each opened pull request. A label
      that fails to apply is logged as a warning and does not fail the PR.
      Note the blast radius: these names are sent to GitHub's add-labels API,
      which may CREATE a label that does not already exist in your repository
      (with a default colour) rather than rejecting it. Create the labels you
      want first if you care about their colour or description.
    required: false
    default: ''
  max-prs:
    description: >-
      Most pull requests one run may propose before it stops (default `10`;
      set `0` for no limit). A blast-radius limit, not a correctness one: if
      something about a run is wrong, this bounds how many pull requests are
      wrong before a human sees one. Nothing is lost — the next run continues
      where this one stopped, since flags already proposed are skipped.
      Candidates that are ignored, already handled, or have nothing to change
      do not count against it. The limit applies to `dry-run` too, so a dry
      run previews the run that would actually happen.
    required: false
    default: '10'
  dry-run:
    description: >-
      When `true` in `remove` mode, compute and print the diff for every
      removal candidate but open no branch, commit, or pull request — nothing
      touches the GitHub API at all. When this input is omitted, the
      underlying tool's own default is `false` (it opens real PRs), so a
      first-time run should set this explicitly. See README's "Dry run"
      section.

      In `pr-command` mode it still checks permissions, reads the pull
      request and posts a reply (so it DOES touch the GitHub API, unlike
      `remove`), but stops before force-pushing the branch or updating the
      pull request — reporting `rerun-dry-run` instead.

      In `archive-sweep` mode it works out exactly which flags the real run
      would attempt and prints one `[would-archive]` line each, sending no
      archive request. It does NOT claim each one would succeed: whether an
      attempt lands or defers is a fact only the attempt has.

      Ignored in `archive-on-merge`, which never opens a branch or a pull
      request either way.
    required: false
    default: 'false'

runs:
  using: 'docker'
  image: 'docker://ghcr.io/canopy-labs/featureflip-flag-cleanup-action@sha256:79aacb7066a6c3cc4adee51f7e55892845948b62bd849e38aa60d3585c9429bd'
  # GitHub maps an input `foo-bar` to `INPUT_FOO-BAR`, which is not a name
  # `flag_cleanup.config` reads. This block bridges each declared input to
  # the exact `FEATUREFLIP_*` environment variable `Config.from_env` expects
  # (see src/flag_cleanup/config.py) — do not rename these; config.py is the
  # authority on the names.
  #
  # GITHUB_TOKEN is deliberately NOT declared as an input here: it is a
  # secret, not a default runner-provided env var, so the calling workflow
  # must pass it through explicitly (see README). GITHUB_REPOSITORY,
  # GITHUB_API_URL and GITHUB_SERVER_URL ARE default environment variables
  # the runner already injects into the container, so no bridging is needed
  # for those three.
  env:
    FEATUREFLIP_API_TOKEN: ${{ inputs.api-token }}
    FEATUREFLIP_ORG: ${{ inputs.org }}
    FEATUREFLIP_PROJECT: ${{ inputs.project }}
    FEATUREFLIP_API_URL: ${{ inputs.api-url }}
    FEATUREFLIP_MODE: ${{ inputs.mode }}
    FEATUREFLIP_DEPLOYMENT_ENVIRONMENT: ${{ inputs.deployment-environment }}
    FEATUREFLIP_STALENESS: ${{ inputs.staleness }}
    FEATUREFLIP_LANGUAGES: ${{ inputs.languages }}
    FEATUREFLIP_ACCESSORS: ${{ inputs.accessors }}
    FEATUREFLIP_DIRECTORIES: ${{ inputs.directories }}
    FEATUREFLIP_IGNORE: ${{ inputs.ignore }}
    FEATUREFLIP_FLAGS: ${{ inputs.flags }}
    FEATUREFLIP_BASE_BRANCH: ${{ inputs.base-branch }}
    FEATUREFLIP_PR_LABELS: ${{ inputs.pr-labels }}
    FEATUREFLIP_MAX_PRS: ${{ inputs.max-prs }}
    FEATUREFLIP_DRY_RUN: ${{ inputs.dry-run }}
