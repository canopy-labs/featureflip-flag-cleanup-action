    object: (identifier) @client
    name: (identifier) @callee
    arguments: (argument_list
      . (method_invocation
          name: (identifier) @outer_method
          arguments: (argument_list
            (method_invocation)
            . [(line_comment) (block_comment)]
            . (method_invocation
              object: (_) @receiver
              name: (identifier) @method
              arguments: (argument_list
                . (string_literal . (string_fragment) @flag_name .)
                . (_) @value .)) @entry)) .))
  (#eq? @outer_method "ofEntries")
  (#eq? @method "entry")
  (#match? @receiver "^(java\\.util\\.)?Map$")
  (#eq? @flag_name "@stale_flag_name")
  (#not-eq? @value "@untreated")
  (#eq? @client "FeatureflipClient")
  (#eq? @callee "forTesting")
)'''
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys", "untreated"]

[[rules.filters]]
enclosing_node = "(argument_list) @registry"
contains = '''(
  (method_invocation
    name: (identifier) @sibling_method
    arguments: (argument_list . (string_literal . (string_fragment) @sibling .)))
  (#eq? @sibling_method "entry")
  (#any-of? @sibling @known_flag_keys)
)'''
at_least = 1

# ===========================================================================
# 3. A `put("k", v);` statement in a block
# ===========================================================================
#
# Any receiver: a test's setup map is `values`, `overrides`, `this.flags`. The
# statement's parent must be a `block`, which keeps a braceless body out. The
# registry prong's evidence is another `put` of a project flag key in the same
# block.

[[rules]]
name = "delete_flag_keyed_boolean_put_statement"
query = '''(
  (block
    (expression_statement
      (method_invocation
        object: (_)
        name: (identifier) @method
        arguments: (argument_list
          . (string_literal . (string_fragment) @flag_name .)
          . [(true) (false)] @value .))) @entry)
  (#eq? @method "put")
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @value "@treated")
)'''
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "treated"]

[[rules]]
name = "delete_flag_keyed_registry_put_statement"
query = '''(
  (block
    (expression_statement
      (method_invocation
        object: (_)
        name: (identifier) @method
        arguments: (argument_list
          . (string_literal . (string_fragment) @flag_name .)
          . (_) @value .))) @entry)
  (#eq? @method "put")
  (#eq? @flag_name "@stale_flag_name")
  (#not-eq? @value "@untreated")
)'''
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys", "untreated"]

[[rules.filters]]
enclosing_node = "(block) @registry"
contains = '''(
  (expression_statement
    (method_invocation
      name: (identifier) @sibling_method
      arguments: (argument_list . (string_literal . (string_fragment) @sibling .) . (_) .)))
  (#eq? @sibling_method "put")
  (#any-of? @sibling @known_flag_keys)
)'''
at_least = 1

# ===========================================================================
# 4. A builder `.put("k", v)` link
# ===========================================================================
#
# Rewritten as its own receiver chain (`replace = "@chain"`), so the link and
# the line break in front of it go together and a one-line chain stays one
# line. Only a link that is itself the receiver of another `put` or of the
# chain's `build` / `buildOrThrow` / `buildKeepingLast`: `Map.put` returns the
# previous value, so `m.put("k", true).toString()` is a use of that value and
# not a link. The registry prong's evidence is another `put` of a project flag
# key in the same chain, found from its `build` call — a chain with no build
# call offers none, and only the stub prong applies there.

[[rules]]
name = "delete_flag_keyed_boolean_builder_put"
query = '''(
  (method_invocation
    object: (method_invocation
      object: (_) @chain
      name: (identifier) @method
      arguments: (argument_list
        . (string_literal . (string_fragment) @flag_name .)
        . [(true) (false)] @value .)) @put
    name: (identifier) @outer_method)
  (#eq? @method "put")
  (#match? @outer_method "^(put|build|buildOrThrow|buildKeepingLast)$")
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @value "@treated")
)'''
replace_node = "put"
replace = "@chain"
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "treated"]

[[rules]]
name = "delete_flag_keyed_registry_builder_put"
query = '''(
  (method_invocation
    object: (method_invocation
      object: (_) @chain
      name: (identifier) @method
      arguments: (argument_list
        . (string_literal . (string_fragment) @flag_name .)
        . (_) @value .)) @put
    name: (identifier) @outer_method)
  (#eq? @method "put")
  (#match? @outer_method "^(put|build|buildOrThrow|buildKeepingLast)$")
  (#eq? @flag_name "@stale_flag_name")
  (#not-eq? @value "@untreated")
)'''
replace_node = "put"
replace = "@chain"
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys", "untreated"]

[[rules.filters]]
enclosing_node = '''(
  (method_invocation name: (identifier) @chain_end)
  (#match? @chain_end "^(build|buildOrThrow|buildKeepingLast)$")
) @registry'''
contains = '''(
  (method_invocation
    name: (identifier) @sibling_method
    arguments: (argument_list . (string_literal . (string_fragment) @sibling .) . (_) .))
  (#eq? @sibling_method "put")
  (#any-of? @sibling @known_flag_keys)
)'''
at_least = 1
