# ===========================================================================
# 2. `Map.entry("k", v)` inside `Map.ofEntries(…)`
# ===========================================================================
#
# One argument is one entry, so a plain node deletion takes the comma with it.
# The FIRST entry of several is rewritten up to the next entry instead, for
# the same whitespace reason as a first pair above. Every rule here needs a
# SURVIVING `Map.entry` beside the doomed one (the `@next`, or the entry just
# before it), so a SOLE entry is never deleted: `Map.ofEntries()` takes its
# types from its context, and under `var` or a generic call it is a
# `Map<Object, Object>` that the code after it no longer compiles against.
# The enclosing call must be `ofEntries`: a `Map.entry` bound to a local is
# not a list element, and deleting it would leave `var e = ;`.

[[rules]]
name = "delete_flag_keyed_boolean_entry_call_first_boolean_map"
query = '''(
  (method_invocation
    name: (identifier) @outer_method
    arguments: (argument_list
      . (method_invocation
        object: (_) @receiver
        name: (identifier) @method
        arguments: (argument_list
          . (string_literal . (string_fragment) @flag_name .)
          . [(true) (false)] @value .)) @entry
      . (method_invocation) @next))
  (#eq? @outer_method "ofEntries")
  (#eq? @method "entry")
  (#match? @receiver "^(java\\.util\\.)?Map$")
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @value "@treated")
)'''
replace_node = "entry"
replace_node_end = "next"
replace = "@next"
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "treated"]

