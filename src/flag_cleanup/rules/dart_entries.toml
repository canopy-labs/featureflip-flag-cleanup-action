# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`'k': {'default': false},`), a test's override entry
# (`{'k': true}`), a plain flag -> value map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see dart.toml). It is allowed
# here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# THE QUOTES ARE PART OF THE COMPARISON, and that is what makes this file
# shaped differently from every other one. Dart's `string_literal` has no
# content child in the sense the other grammars have one: its text sits under
# an ANONYMOUS per-style wrapper, which is why dart.toml's seed rule has to
# reach it two levels down and alternate on the content type
# (`(_ . [(template_chars_single_single) (template_chars_double_single)] .)`).
# Rather than repeat that, these rules capture the WHOLE literal —
# `'old-checkout'` including its quotes — and compare it as written. The cost
# is that a registry may spell its keys either way, so each prong needs two
# rules rather than an alternation inside one; `render_known_flag_keys` pays
# the matching half by emitting BOTH spellings for Dart (`"'k'" "\"k\""`), so
# one `#any-of?` list covers a sibling in either style.
#
# The double-quoted rules use TOML LITERAL multi-line strings (`'''…'''`) on
# purpose: inside a basic `"""…"""` string TOML would consume the backslash
# and hand tree-sitter a bare `"`, ending the query's own string early. Keep
# them literal if these queries are ever edited.
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves.
#
# Note the leading `.` anchors: the queries address a `pair`'s children
# POSITIONALLY, so without the anchor a string VALUE equal to the key would
# match. That is a property of these queries, not of the grammar — a
# tree-sitter-dart `pair` does carry `key:` and `value:` fields (measured), and
# naming them was available. The anchors are kept because the WHOLE literal is
# what is compared here (see above), so the two prongs differ only in whether
# they constrain the value, and `. (string_literal) @flag_name .` reads the
# same in both.
#
# Dart needs no whole-key anchoring INSIDE the literal, which the other seven
# languages in this directory all carry: comparing the literal with its quotes
# already declines an interpolated or escape-split key, because
# `'old-checkout$x'` and `'old-checkout\u0041'` are not textually
# `'old-checkout'`.

# ===========================================================================
# Map entries: `{'k': …}` / `{"k": …}`
# ===========================================================================

# STUB PRONG — the value is a boolean literal: a test override, or a plain
# flag -> value map. May empty its map (`{'k': true}` -> `{}`), which is the
# right shape for an override.
[[rules]]
name = "delete_flag_keyed_boolean_pair_single_quoted"
query = """(
  (pair . (string_literal) @flag_name . [(true) (false)]) @entry
  (#eq? @flag_name "'@stale_flag_name'")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# The same rule for a double-quoted key. See the header on why this is a
# separate rule and why the string delimiter is `'''`.
[[rules]]
name = "delete_flag_keyed_boolean_pair_double_quoted"
query = '''(
  (pair . (string_literal) @flag_name . [(true) (false)]) @entry
  (#eq? @flag_name "\"@stale_flag_name\"")
)'''
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — another pair in the SAME map is keyed by a different flag
# of this project, so the map is a flag-keyed map. The evidence cannot be
# satisfied by the target's own key; sibling evidence inside the target's own
# VALUE is accepted, because `contains` searches the whole subtree and a nested
# flag map is still a flag map. So this prong CAN empty a map whose sole pair
# nests another flag key — measured, and the same trade the stub prong makes.
[[rules]]
name = "delete_flag_keyed_registry_pair_single_quoted"
query = """(
  (pair . (string_literal) @flag_name) @entry
  (#eq? @flag_name "'@stale_flag_name'")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(set_or_map_literal) @registry"
contains = """(
  (pair . (string_literal) @sibling)
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1

# The registry prong for a double-quoted key. The filter is identical: the
# sibling's own quote style is irrelevant, because `render_known_flag_keys`
# puts both spellings of every key in the `#any-of?` list.
[[rules]]
name = "delete_flag_keyed_registry_pair_double_quoted"
query = '''(
  (pair . (string_literal) @flag_name) @entry
  (#eq? @flag_name "\"@stale_flag_name\"")
)'''
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(set_or_map_literal) @registry"
contains = """(
  (pair . (string_literal) @sibling)
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1
