# Constructor-parameter removal, rendered per run by
# `ctor_param_model.render_rules`. Never loaded as shipped.
#
# Blocks start at a `# ctor: <kind>` line. `parameter` blocks are cloned once per
# removal, with __CTOR_CLASS__ and __CTOR_PARAM__ filled in. The `argument` block
# is rendered once, with __CTOR_SENTINEL__: the caller has already replaced every
# argument to delete with that identifier, so deletion is by identity and the
# engine's apply-until-no-match loop stops after the marked arguments. Matching by
# position would re-fire on the argument that shifts into the deleted slot.
#
# No holes and no edges: every rule is a seed that matches on its own.

# ctor: parameter
[[rules]]
name = "delete_ctor_parameter_property"
query = """(
  (class_declaration
    name: (type_identifier) @class_name
    body: (class_body
      (method_definition
        name: (property_identifier) @ctor
        parameters: (formal_parameters
          (required_parameter
            (accessibility_modifier)
            pattern: (identifier) @param_name) @param))))
  (#eq? @class_name "__CTOR_CLASS__")
  (#eq? @ctor "constructor")
  (#eq? @param_name "__CTOR_PARAM__")
)"""
replace_node = "param"
replace = ""
is_seed_rule = true

