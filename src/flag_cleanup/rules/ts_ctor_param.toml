# Constructor-parameter and private-field removal, rendered per run by
# `ctor_param_model.render_rules`. Never loaded as shipped.
#
# Blocks start at a `# ctor: <kind>` line. `parameter` blocks are cloned once per
# removal, with __CTOR_CLASS__ and __CTOR_PARAM__ filled in. They match a
# parameter property and a plain parameter alike: a parameter's name is unique
# in its list, and the caller has proven which one goes. The `argument` blocks
# are rendered once, with __CTOR_SENTINEL__: the caller has already replaced
# every argument to delete with that identifier, every field with a method of
# that name and every statement with that identifier and a `;`
# (`ctor_param_model.FORMS`), so deletion is by identity and the engine's
# apply-until-no-match loop stops after the marked spans. Matching by position
# would re-fire on the argument that shifts into the deleted slot, and the
# engine deletes a field without the `;` after it.
#
# No holes and no edges: every rule is a seed that matches on its own.

# ctor: parameter
[[rules]]
name = "delete_ctor_parameter"
query = """(
  (class_declaration
    name: (type_identifier) @class_name
    body: (class_body
      (method_definition
        name: (property_identifier) @ctor
        parameters: (formal_parameters
          (required_parameter
            pattern: (identifier) @param_name) @param))))
  (#eq? @class_name "__CTOR_CLASS__")
  (#eq? @ctor "constructor")
  (#eq? @param_name "__CTOR_PARAM__")
)"""
replace_node = "param"
replace = ""
is_seed_rule = true

