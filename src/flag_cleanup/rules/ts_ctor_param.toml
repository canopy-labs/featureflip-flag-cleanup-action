# ctor: argument
[[rules]]
name = "delete_ctor_marked_argument"
query = """(
  (arguments (identifier) @arg)
  (#eq? @arg "__CTOR_SENTINEL__")
)"""
replace_node = "arg"
replace = ""
is_seed_rule = true

# ctor: argument
[[rules]]
name = "delete_ctor_marked_member"
query = """(
  (class_body (method_definition name: (property_identifier) @name) @member)
  (#eq? @name "__CTOR_SENTINEL__")
)"""
replace_node = "member"
replace = ""
is_seed_rule = true

# ctor: argument
[[rules]]
name = "delete_ctor_marked_statement"
query = """(
  (statement_block (expression_statement (identifier) @name) @statement)
  (#eq? @name "__CTOR_SENTINEL__")
)"""
replace_node = "statement"
replace = ""
is_seed_rule = true
