# --- a Laravel guard helper the fold made constant
#
# `abort_unless(Features::enabled('k'), 404)` folds to `abort_unless(true, 404)`.
# Laravel's four global guards: `abort_unless`/`throw_unless` pass on `true`,
# `abort_if`/`throw_if` pass on `false`. A passing guard is deleted -- but only when
# its other arguments are literals, names, `Foo::class` or a `new` of a class with
# up to two literal arguments, so that nothing with an effect goes with it.
# A guard that always stops is rewritten to the call it was: `abort_unless(false,
# 404, 'x')` is `abort(404, 'x')`, and `throw_if(true, new E())` is `throw new E();`.
# A deletion is refused inside a braceless `if`/`else`/loop: `if ($c)
# abort_unless(true, 404);` is the body of the `if`, and deleting it would hand the
# next statement to the `if`. Reached only from the fold's own literal
# (php_edges.toml), never as a seed, so a guard the customer wrote with a
# literal stays.

[[rules]]
name = "delete_passing_abort_unless_0"
query = """(
  (expression_statement
    (function_call_expression
      function: (name) @guard_fn
      arguments: (arguments . (argument (boolean) @guard_lit) .))) @statement
  (#eq? @guard_fn "abort_unless")
  (#match? @guard_lit "^[Tt][Rr][Uu][Ee]$")
)"""
replace_node = "statement"
replace = ""
groups = ["trivial_guard"]
is_seed_rule = false

[[rules.filters]]
not_enclosing_node = """[
  (if_statement body: (expression_statement))
  (else_clause body: (expression_statement))
  (else_if_clause body: (expression_statement))
  (while_statement body: (expression_statement))
  (for_statement body: (expression_statement))
  (foreach_statement body: (expression_statement))
  (do_statement body: (expression_statement))
] @braceless"""

[[rules]]
name = "delete_passing_abort_unless_1"
query = """(
  (expression_statement
    (function_call_expression
      function: (name) @guard_fn
      arguments: (arguments . (argument (boolean) @guard_lit) . (argument [(string) (integer) (float) (null) (boolean) (variable_name) (class_constant_access_expression) (object_creation_expression [(name) (qualified_name)] (arguments)) (object_creation_expression [(name) (qualified_name)] (arguments (argument [(string) (integer) (float) (null) (boolean)]))) (object_creation_expression [(name) (qualified_name)] (arguments (argument [(string) (integer) (float) (null) (boolean)]) (argument [(string) (integer) (float) (null) (boolean)])))]) .))) @statement
  (#eq? @guard_fn "abort_unless")
  (#match? @guard_lit "^[Tt][Rr][Uu][Ee]$")
)"""
replace_node = "statement"
replace = ""
groups = ["trivial_guard"]
is_seed_rule = false

