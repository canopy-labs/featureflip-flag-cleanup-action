      (scoped_call_expression
        scope: [(relative_scope) (name)] @assert_receiver
        name: (name) @assert_method
        arguments: [
          (arguments . (argument (boolean) @expected) . (argument (boolean) @actual) .)
          (arguments . (argument (boolean) @expected) . (argument (boolean) @actual) . (argument [(string) (encapsed_string)]) .)
        ])
    ]) @statement
  (#match? @assert_receiver "^([$]this|self|static|Assert)$")
  (#match? @assert_method "^(assertSame|assertEquals)$")
  (#eq? @expected @actual)
)"""
replace_node = "statement"
replace = ""
groups = ["trivial_assertion"]
is_seed_rule = false

[[rules.filters]]
not_enclosing_node = """[
  (if_statement body: (expression_statement))
  (else_clause body: (expression_statement))
  (else_if_clause body: (expression_statement))
  (while_statement body: (expression_statement))
  (for_statement body: (expression_statement))
  (foreach_statement body: (expression_statement))
  (do_statement body: (expression_statement))
] @braceless"""

# --- Pest: `expect(<literal>)->toBeTrue()` and its kin (the same group)
#
# `expect(Feature::active('k'))->toBeTrue();` folds to `expect(true)->toBeTrue();`,
# which Pest's chain makes one node deeper than PHPUnit's call: literal ->
# argument list -> `expect(...)` -> `->matcher()` -> statement. The match-only
# `trivial_expect_subject` hop matches `expect(<literal>)` from the literal and
# its own edge (php_edges.toml) walks on to the statement, as `ts_assertions.toml`
# does. `->not->` adds a `member_access_expression` between the two, still within
# the walk. Only a literal the fold wrote is reached; the failing literal is
# never matched and is reported (the Action's failing-assertion check, which
# lists the same matchers).
[[rules]]
name = "trivial_expect_subject"
query = """(
  (function_call_expression
    function: (name) @expect_fn
    arguments: (arguments . (argument (boolean)) .)) @expect_call
  (#eq? @expect_fn "expect")
)"""
groups = ["trivial_expect_subject"]
is_seed_rule = false

[[rules.filters]]
not_enclosing_node = """[
  (if_statement body: (expression_statement))
  (else_clause body: (expression_statement))
  (else_if_clause body: (expression_statement))
  (while_statement body: (expression_statement))
  (for_statement body: (expression_statement))
  (foreach_statement body: (expression_statement))
  (do_statement body: (expression_statement))
] @braceless"""

[[rules]]
name = "delete_trivially_true_expect"
query = """(
  (expression_statement
    (member_call_expression
      object: (function_call_expression
            function: (name) @expect_fn
            arguments: (arguments . (argument (boolean) @subject) .))
      name: (name) @matcher
      arguments: (arguments))) @statement
  (#eq? @expect_fn "expect")
  (#match? @matcher "^(toBeTrue|toBeTruthy)$")
  (#match? @subject "^[Tt][Rr][Uu][Ee]$")
)"""
replace_node = "statement"
replace = ""
groups = ["trivial_assertion"]
is_seed_rule = false

[[rules.filters]]
not_enclosing_node = """[
  (if_statement body: (expression_statement))
