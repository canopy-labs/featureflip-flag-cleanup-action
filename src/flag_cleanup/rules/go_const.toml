# KEY-const propagation for Go — the flag key hoisted to a `const`, as in
#
#     const oldCheckout = "old-checkout"
#     ...
#     if client.BoolVariation(oldCheckout, ctx, false) { ... }
#
# `piranha_runner` prepends this file to `go.toml` for files that pass the
# Gate 2 shadow check (see `flag_cleanup.key_const`).
#
# accessor-guard: none — see `rule_synthesis.with_accessor_guards`. This file
# resolves a flag KEY, not a flag READ, so it binds no name that a non-flag call
# could be re-bound to and there is no `(#not-eq? @callee ...)` guard to extend.
#
# It does NOT mean this file needs nothing from `rule_synthesis`. The fold rules
# below are pinned to an SDK callee by `(#eq? @sdk_fn "…")` exactly as the seed
# rules in the language file are, so they are CLONED per accessor too — see
# `rule_synthesis.with_accessor_const_rules`. Reading the marker as "no accessor
# handling here" is what left a wrapper unable to reach a hoisted key for the
# life of this file (#2730), and `key_const` has to be widened in the same
# breath or the gate withholds the file the clones would have cleaned.
# The TS const rules DO bind a read and must carry one; that asymmetry is why
# the marker is explicit rather than inferred from the file's shape.
#
# --- WHAT THIS FIXES ---------------------------------------------------------
#
# `go.toml`'s seed rule anchors a string LITERAL first argument, so an
# identifier there is not a weak match — it is structurally unmatchable. Before
# this file, a Go codebase that hoisted its keys (the conventional thing to do)
# reported `no-changes` for every flag: no pull request, and nothing anywhere
# saying why. Same silent no-op class as #2525 closed for C#.
#
# --- THE SAFETY ARGUMENT IS GATE 2, NOT THE QUERIES --------------------------
#
# `key_const.path_is_safe` withholds this whole file from any source where the
# const's name is bound more than once, or is referenced by anything other than
# a flag read this file's rules will themselves remove. Following the lesson at
# the top of `ts_const.toml`: enumerating the unsafe shapes in tree-sitter query
# guards leaked twice for TS, so the queries below are NOT where the safety
# lives. Two concrete losses if that check is weakened:
#
#   1. WRONG BRANCH. `enclosing_node` finds a package-level const from anywhere
#      in the file, INCLUDING a function that shadows the name with its own
#      const bound to a different key. Without the bound-exactly-once check the
#      other flag's read folds to THIS flag's value — it compiles, it looks
#      right, and it is wrong. `tests/fixtures/go/const_key_shadowed`.
#   2. DANGLING REFERENCE. The delete rule below removes the declaration. If
#      anything else in the file still reads the const, the result does not
#      compile. `tests/fixtures/go/const_key_other_usage`.
#
# Gate 1 catches NEITHER: the first produces valid Go with no ERROR nodes, and
# the second is a name-resolution error one layer below anything a re-parse can
# see.
#
# --- grammar facts -----------------------------------------------------------
#
# The key is matched through a WILDCARD child of the string literal, not by
# naming the content node — Piranha's bundled Go grammar has no
# `interpreted_string_literal_content` (the name the current grammar uses), and
# capturing the literal WHOLE is useless because its text includes the quotes.
# See the long note in `go.toml`; the same constraint applies here. The GATE's
# grammar (the `tree-sitter-go` wheel) DOES expose the content node, which is
# why `key_const._go_key_consts` reads it by name with a quote-stripping
# fallback rather than sharing this file's wildcard.
#
# `var_declaration` is a different node type from `const_declaration`, so a
# mutable `var` key is structurally unmatchable here rather than needing a
# guard — which matters, because a `var` may be reassigned and its declaration
# is therefore not a resolvable value.
#
# TWO anchors bound the declaration, on two different dimensions, and it takes
# both. Dropping either is #2700 again.
#
#   1. `. (const_spec …) .` means EXACTLY ONE SPEC: the spec must immediately
#      follow the `const` token and also be last. A grouped
#      `const ( a = "x"; b = "y" )` therefore matches nothing here.
#   2. `value: (expression_list . (…) .)` means EXACTLY ONE VALUE — and a Go
#      const spec binds as many names as it has values, so this is what makes
#      "exactly one NAME" true. Without it `const a, b = "old-checkout", "x"`
#      is one spec and matched, while `key_const._go_key_consts` skips it for
#      having two names; a file whose only key const the gate skips looks EMPTY
#      to `path_is_safe`, which calls it trivially safe, so these rules then run
#      with NO GATE AT ALL and the delete rule takes `b` with it. `go build`
#      says `undefined: b`.
#
# Both fail closed to a silent no-op rather than to a broken build, because the
# delete rule removes the whole `const_declaration` and would otherwise carry
# off constants it was never asked about.
#
# Note what the anchors do NOT do: `@decl_name` and `@flag_name` are captured
# independently, so nothing pairs a name with the value written beside it.
# Bounding the declaration to one of each is what makes that irrelevant.
#
# Holes: @stale_flag_name (the flag key), @treated ("true" | "false").

# --- BoolVariation(oldCheckout, …) AS A WHOLE STATEMENT -> deleted -----------
#
# The statement-position read with the key behind a `const`. `go.toml`'s
# `delete_discarded_boolvariation_statement` anchors a string LITERAL, so a
# hoisted key never reached it: the read folded to a bare `true`, which Go will
# not even let you discard (`true (untyped bool constant) is not used`), and the
# whole flag was refused (#2716). Hoisting a key read more than once is the
# conventional shape, so this is the position the const path did not carry.
#
# THIS RULE MUST STAY ABOVE `replace_boolvariation_const_key_read_with_boolean_literal`
# below. Seed rules fire in declaration order and that rule rewrites the CALL —
# the child of the statement this one wants — so declared second it never fires
# and the refusal silently comes back. `_execute` PREPENDS this whole file, so
# being above `go.toml`'s rules is already true; being above this file's own
# read rule is what the position buys, and
# `test_a_discarded_read_rule_declared_second_stops_firing` pins both.
#
# THE FILTERS ARE THE LITERAL RULE'S, UNCHANGED, plus this file's declaration
# resolution: the statement may hold exactly ONE argument list, its own, and no
# `unary_expression` (`<-ch` is a side effect written with no call). The safety
# argument does not depend on how the key is spelled, and Gate 2 withholds this
# whole file long before it for anything that reads the const outside a flag
# read.
[[rules]]
name = "delete_discarded_boolvariation_const_key_statement"
query = """(
  (expression_statement
    (call_expression
      function: [(selector_expression field: (field_identifier) @sdk_fn)
                 (identifier) @sdk_fn]
      arguments: (argument_list . (identifier) @key_const))) @statement
  (#eq? @sdk_fn "BoolVariation")
)"""
replace_node = "statement"
replace = ""
holes = ["stale_flag_name"]

# Both scopes a resolvable const can live in — the same pair, and for the same
# reason, as the read rule's filter below.
[[rules.filters]]
enclosing_node = """(
  [(source_file
     (const_declaration
       . (const_spec
           name: (identifier) @decl_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .))
   (statement_list
     (const_declaration
       . (const_spec
           name: (identifier) @decl_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .))] @scope
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @decl_name "@key_const")
)"""

[[rules.filters]]
contains = """((argument_list) @arg_list)"""
at_most = 1

[[rules.filters]]
not_contains = ["""((unary_expression) @receive_or_negation)"""]

# --- fold the read: `BoolVariation(oldCheckout, …)` -> @treated --------------
# Declared BEFORE the delete rule. Seed rules fire in declaration order, and the
# delete rule's filter additionally refuses while any such call survives, so the
# declaration cannot be removed out from under a read that still needs it.
[[rules]]
name = "replace_boolvariation_const_key_read_with_boolean_literal"
query = """(
  (call_expression
    function: [(selector_expression field: (field_identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list . (identifier) @key_const)
  ) @call
  (#eq? @sdk_fn "BoolVariation")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]

# Both scopes a resolvable const can live in. A package-level const is a
# SIBLING of the function holding the read, not an ancestor of it, so the
# enclosing node here is the `source_file` itself — unlike C#, where the
# class-level declaration list already encloses the method.
[[rules.filters]]
enclosing_node = """(
  [(source_file
     (const_declaration
       . (const_spec
           name: (identifier) @decl_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .))
   (statement_list
     (const_declaration
       . (const_spec
           name: (identifier) @decl_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .))] @scope
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @decl_name "@key_const")
)"""

# --- delete the now-unused declaration ---------------------------------------
# Flag-key-scoped: the initialiser must be THIS flag's key, so there is no blast
# radius on unrelated `const`s.
#
# ROOTED AT THE PARENT and deleting the declaration as a child of it, for the
# reason `ts_const.toml`'s and `csharp_const.toml`'s delete rules are: matching
# the declaration on its own ignores what encloses it, and a wrapper we did not
# anticipate would have its insides removed and its shell left behind.
#
# The filter is a SEQUENCING guard, not the safety argument (Gate 2 is — see the
# header): while any call still takes this const as its first argument, the
# declaration stays. Without it the delete rule could fire first and strand the
# reads it was supposed to follow, which is a broken build rather than a
# half-finished cleanup.
[[rules]]
name = "delete_flag_key_const_declaration"
query = """(
  [(source_file
     (const_declaration
       . (const_spec
           name: (identifier) @variable_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .) @declaration)
   (statement_list
     (const_declaration
       . (const_spec
           name: (identifier) @variable_name
           value: (expression_list . (interpreted_string_literal (_) @flag_name) .)) .) @declaration)] @scope
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "declaration"
replace = ""
holes = ["stale_flag_name"]

[[rules.filters]]
enclosing_node = """([(source_file) (function_declaration) (block)] @container)"""
not_contains = ["""(
  (call_expression
    arguments: (argument_list . (identifier) @first_arg)) @surviving_read
  (#eq? @first_arg "@variable_name")
)"""]
