# Wires edges onto Dart's built-in cascade (see dart.toml). Piranha reads
# [[edges]] only from this file, never from rules.toml.
#
# Dart is a built-in engine language, so `get_rule_graph` MERGES what is here
# with the engine's own Dart edges rather than replacing them: every built-in
# edge is still in force and must not be restated.
#
# An assertion the fold made trivially true is deleted (dart_assertions.toml,
# `trivial_assertion`). Only from the groups that write a literal, so only an
# assertion this run's fold produced is reached: Parent scope walks the
# literal, its argument list, the call and the statement. A literal inside an
# `equals(...)` matcher is one call deeper than the walk reaches, so it goes
# through the match-only `trivial_equals_matcher` hop first. An assertion of
# the flag's own value (`flag_value_assertion`) is reached from the seed's
# literal only, never from a simplification: see dart_assertions.toml.
[[edges]]
scope = "Parent"
from = "replace_expression_with_boolean_literal"
to = ["trivial_assertion", "trivial_equals_matcher", "flag_value_assertion"]

[[edges]]
scope = "Parent"
from = "boolean_expression_simplify"
to = ["trivial_assertion", "trivial_equals_matcher"]

[[edges]]
scope = "Parent"
from = "trivial_equals_matcher"
to = ["trivial_assertion"]

# A test the flag-value deletion emptied goes too (dart_assertions.toml): the
# closure is three nodes above the deleted statement, so a match-only hop
# finds it and walks on to the `test(...)` statement.
[[edges]]
scope = "Parent"
from = "flag_value_assertion"
to = ["flag_value_emptied_closure"]

[[edges]]
scope = "Parent"
from = "flag_value_emptied_closure"
to = ["flag_value_emptied_test"]
