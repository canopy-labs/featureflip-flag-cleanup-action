    arguments: (argument_list
      . (identifier) @key_member
      (keyword_argument
        name: (identifier) @kw
        value: [(true) (false)]))
  ) @call
  (#eq? @sdk_fn "variation")
  (#eq? @kw "default")
  (#eq? @key_member "__XCONST_MEMBER__")
)"""
replace_node = "call"
