# Blocks marked `# xconst: enum-qualified-field` match a read through an enum
# member's `.value` (`Owner.MEMBER.value`), with __XCONST_ACCESSOR__ replaced
# by `value`. As for `# xconst: qualified`, the WHOLE key expression's text is
# matched, so an owner of any depth (`F`, `app.flags.Flags`, `m.Flags`) needs
# no further shape, and a read spelled with whitespace is left standing.

[[rules]]
# xconst: enum-qualified-field
name = "xconst_enum_variation_read"
query = """(
  (call
    function: [(attribute attribute: (identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (attribute) @key_ref
      . (_)
      . [(true) (false)])
  ) @call
  (#eq? @sdk_fn "variation")
  (#eq? @key_ref "__XCONST_OWNER__.__XCONST_MEMBER__.__XCONST_ACCESSOR__")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated"]

[[rules]]
# xconst: enum-qualified-field
name = "xconst_enum_variation_keyword_read"
query = """(
  (call
    function: [(attribute attribute: (identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (attribute) @key_ref
      (keyword_argument
        name: (identifier) @kw
        value: [(true) (false)]))
  ) @call
  (#eq? @sdk_fn "variation")
  (#eq? @kw "default")
  (#eq? @key_ref "__XCONST_OWNER__.__XCONST_MEMBER__.__XCONST_ACCESSOR__")
)"""
replace_node = "call"
replace = "@treated"
