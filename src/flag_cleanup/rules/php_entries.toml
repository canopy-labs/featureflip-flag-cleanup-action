# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`'k' => ['default' => false],`), a test's override entry
# (`['k' => TRUE]`), a plain flag -> value map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see php.toml). It is allowed
# here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# Keys come in two spellings: `'k'` parses as `string`, `"k"` as
# `encapsed_string`. Both carry a `string_content` child, so the comparison is
# against the key text and quote style does not matter. `TRUE`/`true`/`False`
# all parse as `boolean`, so the stub prong is case-blind for free.
#
# BOTH SPELLINGS ARE DOUBLE-ANCHORED — `(string . (string_content) @flag_name
# .)` — and that is what makes the comparison a WHOLE-KEY comparison rather
# than a prefix one. Either literal may carry several named children:
# interpolation splits an `encapsed_string` (`"old-checkout{$x}"` is
# `(string_content "old-checkout")` followed by a NAMED `variable_name`) and so
# does an escape (`"old-checkout\x41"` is `(string_content "old-checkout")
# (escape_sequence)`), so the single-child form deleted entries whose key
# merely CONTAINS the flag name (measured). The quotes and the interpolation
# braces are anonymous nodes, which anchors ignore, so the plain literals still
# match; `$interp` in the fixture pins the rest.
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves.
#
# Note the leading `.` anchors: `array_element_initializer`'s children are
# positional and unnamed (`key => value`), so without the anchor a string
# VALUE equal to the key would match.
#
# AND NOTE THE TRAILING `. (_)`, WHICH IS WHAT REQUIRES THE `=>` FORM. PHP is
# the one language here whose array element may have no key at all: a plain
# list item is an `array_element_initializer` with a SINGLE named child, so
# `['legacy-banner', 'old-checkout']` presented the flag string as a "key" and
# the registry prong rewrote it to `['legacy-banner']` (measured). That is not
# an entry keyed by the flag — it is a value that happens to be the flag name,
# which is a READ this file has no business deleting. Requiring a following
# value child declines it; `$list` in the fixture pins it. The `contains`
# sibling pattern carries the same requirement, so a keyless neighbour is not
# evidence of a registry either. The stub prong already had it in the shape of
# its `(boolean)` value.

# ===========================================================================
# Array elements: `['k' => …]` / `array('k' => …)`
# ===========================================================================

# STUB PRONG — the value is a boolean literal: a test override, or a plain
# flag -> value map. May empty its array (`['k' => TRUE]` -> `[]`), which is
# the right shape for an override.
[[rules]]
name = "delete_flag_keyed_boolean_element"
query = """(
  (array_element_initializer
    . [(string . (string_content) @flag_name .) (encapsed_string . (string_content) @flag_name .)]
    . (boolean)) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — another element in the SAME array is keyed by a different
# flag of this project, so the array is a flag-keyed map. The evidence cannot
# be satisfied by the target's own key; sibling evidence inside the target's
# own VALUE is accepted, because `contains` searches the whole subtree and a
# nested flag map is still a flag map. So this prong CAN empty an array whose
# sole element nests another flag key — measured, and the same trade the stub
# prong makes.
[[rules]]
name = "delete_flag_keyed_registry_element"
query = """(
  (array_element_initializer
    . [(string . (string_content) @flag_name .) (encapsed_string . (string_content) @flag_name .)]
    . (_)) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(array_creation_expression) @registry"
contains = """(
  (array_element_initializer
    . [(string . (string_content) @sibling .) (encapsed_string . (string_content) @sibling .)]
    . (_))
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1
