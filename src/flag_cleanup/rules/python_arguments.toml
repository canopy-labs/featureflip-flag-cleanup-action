# Extra polyglot_piranha.PiranhaArguments keyword flags, passed through by
# piranha_runner.run_piranha. (language, substitutions, paths and rule-graph
# are supplied by the runner, not here.)
[piranha_arguments]
# Cut the blank lines a removal leaves to what black and ruff write there.
#
# This was OFF for Python, the one language where it used to do more harm than
# the hole it filled: the engine collapsed every run of blank lines in the WHOLE
# file to one, which rewrote PEP 8's two blank lines between top-level
# definitions far from the removal (`E302`). Off, a deleted statement kept the
# blank lines on both sides, and the run of two to five that resulted failed
# `black --check` and `ruff format --check` at the deletion site.
#
# The engine now touches only the runs an edit wrote or sits against, and for
# Python cuts each to what the formatters write instead of to one: none at
# either end of the file, inside brackets, after a decorator or at the start of
# a block; two before a line at column 0; one anywhere else. A run is never
# lengthened, and a run inside a string is left whole.
delete_consecutive_new_lines = true
