# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`'k' => { default: false },`), a test's override entry
# (`{ 'k' => true }`), a plain flag -> value map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Loaded for `ruby` AND `erb` (`rule_base="ruby"`, so `erb` runs this file
# unmodified through the synthesized Ruby view). No `.erb` fixture is
# required for that reason — a `ruby` fixture pins the rules, and the ERB
# section's own cases confirm the view carries an appended file at all.
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see ruby.toml). It is
# allowed here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# Keys come in three spellings: `'k' =>` parses as `string`, `k:` as
# `hash_key_symbol` (a hyphenated flag key cannot be a bare symbol, but the
# alternation is kept so a customer's `newNav:` registry is not silently
# half-handled).
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves.
#
# EVERY STRING KEY IS DOUBLE-ANCHORED — `(string . (string_content) @flag_name
# .)` — and that is what makes the comparison a WHOLE-KEY comparison rather
# than a prefix one. A `string` may carry several named children: interpolation
# splits it (`"old-checkout#{x}"` is `(string_content "old-checkout")
# (interpolation)`) and so does an escape (`"old-checkout\x41"` is
# `(string_content "old-checkout")(escape_sequence)`), so the single-child form
# deleted entries whose key merely CONTAINS the flag name (measured). The
# quotes are anonymous nodes here — unlike Python's — so anchors ignore them
# and the plain literal still matches; `INTERP` in the fixture pins the rest.

# ===========================================================================
# Hash entries: `{ 'k' => … }` / `{ k: … }`
# ===========================================================================

# STUB PRONG — the value is a boolean literal: a test override, or a plain
# flag -> value map. May empty its hash (`{ 'k' => true }` -> `{}`), which is
# the right shape for an override.
[[rules]]
name = "delete_flag_keyed_boolean_pair"
query = """(
  (pair
    key: [(string . (string_content) @flag_name .) (hash_key_symbol) @flag_name]
    value: [(true) (false)]) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — another pair in the SAME hash is keyed by a different flag
# of this project, so the hash is a flag-keyed map. The evidence cannot be
# satisfied by the target's own key; sibling evidence inside the target's own
# VALUE is accepted, because `contains` searches the whole subtree and a nested
# flag map is still a flag map. So this prong CAN empty a hash whose sole pair
# nests another flag key — measured, and the same trade the stub prong makes.
[[rules]]
name = "delete_flag_keyed_registry_pair"
query = """(
  (pair key: [(string . (string_content) @flag_name .) (hash_key_symbol) @flag_name]) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(hash) @registry"
contains = """(
  (pair key: [(string . (string_content) @sibling .) (hash_key_symbol) @sibling])
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1
