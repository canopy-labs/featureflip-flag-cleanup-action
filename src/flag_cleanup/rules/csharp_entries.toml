# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`{ "k", false },`), a test's override entry
# (`new Dictionary<string, bool> { { "k", true } }`), a plain flag -> value
# map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see csharp.toml). It is
# allowed here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves. Emptying the sole entry of a one-line initializer
# leaves `{  }`, which the tidy's emptied-pair form collapses to `{}`
# (measured — that is what the `Overrides` line of the fixture pins).
#
# C# HAS TWO COLLECTION-INITIALIZER SPELLINGS and both are common, so this
# file carries four rules rather than two: the `{ "k", v }` element form and
# the `["k"] = v` indexed form. They are unrelated in the grammar — the first
# is an `initializer_expression`, the second an `assignment_expression` whose
# left side is an `element_binding_expression` — so neither prong of one can
# see the other's shape.
#
# THE ELEMENT FORM'S ENTRY AND ITS CONTAINER ARE THE SAME NODE TYPE, so both
# of its prongs put the CONTAINER IN THE QUERY —
# `(initializer_expression (initializer_expression …) @entry) @container`, still
# replacing `entry`. That is the only way to require the entry's DIRECT parent
# to be a dictionary initializer, and the direct parent is the requirement.
#
# An `enclosing_node` filter cannot express it. That filter walks up from the
# matched node and stops at the NEAREST ancestor matching its pattern, and
# nearest is not direct: `(initializer_expression (initializer_expression))`
# walks straight past an intervening `array_creation_expression`, so in
# `Dictionary<string, object[]> Rows = new() { { "x", new object[] {
# "old-checkout", true } } }` the DICTIONARY's initializer two levels up
# satisfied it and the INNER array element was deleted. Both prongs did it and
# they failed differently (measured): the stub prong left `new object[]  `,
# which tree-sitter-c-sharp parses with ZERO ERROR nodes, so
# `transform_broke_syntax` waved it through and the Action would have opened a
# pull request full of C# that does not compile; the registry prong left
# `new[]  `, which trips the engine's own per-edit check and aborts the run
# with `PanicException: Produced syntactically incorrect source code`. `Rows`
# and `RowsR` in the fixture are what hold this.
#
# The same requirement is what keeps a bare `new object[] { "k", true }`, a
# `new List<object> { "k", true }` and an xUnit `yield return new object[] {
# flagKey, expected };` row out — their initializer's parent is an
# object-creation expression, not another initializer, and `Row` and `Pair`
# hold those. The sole-entry dictionary still matches — `{ { "k", true } }` is
# an initializer with one initializer child — which is what keeps the
# `Overrides` shape working.
#
# The registry prong keeps ONE filter, and its `enclosing_node` is now only the
# scope its `contains` searches rather than a correctness pin. It must still be
# written as the NESTED `(initializer_expression (initializer_expression))`
# and not the bare form: `enclosing_node` starts AT the matched node, so the
# bare pattern resolves to `@entry` itself — a scope with no siblings in it,
# which made the prong fire on nothing at all (measured on `OneLine`, which
# stopped being deleted).
#
# The indexed form needs no such care: its entry is an `assignment_expression`,
# a different type from the `initializer_expression` that holds it, and an
# `["k"] = v` element is not valid array-initializer syntax in the first place.
# Its registry prong pins the plain `(initializer_expression)` only to give
# `contains` a container to search.
#
# Note the anchors around the key — TWO different requirements. The leading `.`
# on the element form pins the key to the entry's first child: an
# `initializer_expression` entry's children are positional, so without it a
# string VALUE equal to the key (`{ "other", "old-checkout" }`) would match as
# if it were the key. The PAIR of anchors inside the literal,
# `(string_literal . (string_literal_content) @flag_name .)`, is what makes the
# comparison a WHOLE-KEY comparison: a `string_literal` may carry more than one
# named child, and `"old-checkout\u0041"` splits into a `string_literal_content`
# of exactly `old-checkout` plus an `escape_sequence` — so the single-child form
# deleted an entry whose key is `old-checkoutA` (measured). Requiring the
# content to be both the first and the last named child declines every such
# key. An interpolated `$"old-checkout{x}"` is a different node type
# (`interpolated_string_expression`) and never matched; `Interp` pins it anyway.

# ===========================================================================
# Collection initializer, element form: `{ { "k", … } }`
# ===========================================================================

# STUB PRONG — the value is a boolean literal: a test override, or a plain
# flag -> value map. May empty its initializer (`{ { "k", true } }` -> `{}`),
# which is the right shape for an override.
[[rules]]
name = "delete_flag_keyed_boolean_collection_element"
query = """(
  (initializer_expression
    (initializer_expression
      . (string_literal . (string_literal_content) @flag_name .)
      . (boolean_literal)) @entry) @container
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — another element in the SAME initializer is keyed by a
# different flag of this project, so the initializer is a flag-keyed map. The
# evidence cannot be satisfied by the target's own key; sibling evidence inside
# the target's own VALUE is accepted, because `contains` searches the whole
# subtree and a nested flag map is still a flag map. So this prong CAN empty an
# initializer whose sole element nests another flag key — measured, and the
# same trade the stub prong makes.
[[rules]]
name = "delete_flag_keyed_registry_collection_element"
query = """(
  (initializer_expression
    (initializer_expression
      . (string_literal . (string_literal_content) @flag_name .)
      . (_)) @entry) @container
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

# One filter, one concern: the sibling evidence. Its `enclosing_node` is the
# scope `contains` searches and nothing more — the container requirement lives
# in the query above. It names the NESTED initializer because `enclosing_node`
# starts at the matched node and the bare form would resolve to `@entry`; see
# the header.
[[rules.filters]]
enclosing_node = "(initializer_expression (initializer_expression)) @registry"
contains = """(
  (initializer_expression . (string_literal . (string_literal_content) @sibling .) . (_))
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1

# ===========================================================================
# Collection initializer, indexed form: `{ ["k"] = … }`
# ===========================================================================

# STUB PRONG — as above, for the indexed spelling.
[[rules]]
name = "delete_flag_keyed_boolean_index_element"
query = """(
  (assignment_expression
    left: (element_binding_expression (argument (string_literal . (string_literal_content) @flag_name .)))
    right: (boolean_literal)) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — as above, for the indexed spelling. The `left:`/`right:`
# fields make the anchors unnecessary here.
[[rules]]
name = "delete_flag_keyed_registry_index_element"
query = """(
  (assignment_expression
    left: (element_binding_expression (argument (string_literal . (string_literal_content) @flag_name .)))) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(initializer_expression) @registry"
contains = """(
  (assignment_expression
    left: (element_binding_expression (argument (string_literal . (string_literal_content) @sibling .))))
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1
