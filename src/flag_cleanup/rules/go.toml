# Piranha flag-cleanup rules for Go (go SDK).
#
# Like java.toml and unlike ts.toml, this is short: Piranha ships built-in
# feature-flag cleanup rules for Go, so one seed rule yields the whole cascade —
# the enclosing `if` folds, `!read` and `read && other` simplify, and a local
# `enabled := <read>` is inlined and its declaration deleted.
#
# Holes filled per invocation via substitutions:
#   @stale_flag_name -> the flag key (matched against the first string-literal arg)
#   @treated         -> "true" | "false"


# ===========================================================================
# 1. The flag read
# ===========================================================================

# --- @sentinel(…) — a call to a keyless wrapper, proven and marked before the engine
#
# Reached ONLY through the wrapper pass (`wrapper_inline`), as the rules of
# these names at the top of java.toml are. The pass proves that a call such as
# `flags.NewCheckout(u)` or `s.flags.newCheckout(u)` reaches a function or
# method whose whole body is a read of this flag, and replaces the callee with
# the run's sentinel identifier: `__ff_cleanup_<hash>(u)`. Which calls are this
# flag's was decided there, call by call, so these rules check nothing but the
# sentinel. A sentinel left behind is a refusal, never a diff
# (`SentinelPrePass.survived`).
#
# Holes name `sentinel` and not `stale_flag_name`: a call-site file names no
# key, and the engine skips a file holding none of a seed's hole values.
#
# The discarded-statement rule comes first for the reason the BoolVariation
# pair below is ordered that way: `true` alone is not a Go statement. It needs
# no argument filter, because the wrapper pass refuses every call whose
# arguments hold a call or a receive.
[[rules]]
name = "delete_discarded_sentinel_statement"
query = """(
  (expression_statement
    (call_expression
      function: (identifier) @sdk_fn
    ) @call
  ) @stmt
  (#eq? @sdk_fn "@sentinel")
)"""
replace_node = "stmt"
replace = ""
holes = ["sentinel"]

[[rules]]
name = "replace_sentinel_read_with_boolean_literal"
query = """(
  (call_expression
    function: (identifier) @sdk_fn
  ) @call
  (#eq? @sdk_fn "@sentinel")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "sentinel"]

# --- <obj>.BoolVariation("KEY", ...) AS A WHOLE STATEMENT -> deleted
#
# The same shape and the same fix as java.toml's rule of this name — see there
# for the ordering constraint and the safety argument, both of which apply
# unchanged. Go is if anything the clearer case: the compiler will not even let
# the value be discarded, so the folded `true` is `true (untyped bool constant)
# is not used` and the flag was refused permanently (#2691).
#
# THIS RULE MUST STAY ABOVE `replace_boolvariation_read_with_boolean_literal`,
# for the reason given in java.toml. Declared second it never fires.
#
# The one-argument-list filter carries the whole safety argument here too, and
# Go needs LESS around it than Java does: there is no `++` and no assignment
# among Go's expressions — both are statements, so neither can appear as an
# argument — which is why this rule has no `not_contains` to Java's two. A
# composite literal (`Context{User: "u"}`) has a `literal_value`, not an
# argument list, and is genuinely pure: Go has no constructors, so deleting one
# loses nothing. `Context{User: build()}` puts a call back inside and is refused
# by the count, at any depth.
#
# `unary_expression` IS listed, and only Go needs it: `<-ch` receives from a
# channel, which is a side effect written with no call and no argument list. It
# takes `!strict` and `-1` with it, which is over-refusal in a position where
# neither is a plausible argument to a boolean flag read — the direction this
# tool errs in everywhere else.
[[rules]]
name = "delete_discarded_boolvariation_statement"
query = """(
  (expression_statement
    (call_expression
      function: [(selector_expression field: (field_identifier) @sdk_fn)
                 (identifier) @sdk_fn]
      arguments: (argument_list . (interpreted_string_literal (_) @flag_name)))) @statement
  (#eq? @sdk_fn "BoolVariation")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "statement"
replace = ""
holes = ["stale_flag_name"]

[[rules.filters]]
contains = """((argument_list) @arg_list)"""
at_most = 1

[[rules.filters]]
not_contains = ["""((unary_expression) @receive_or_negation)"""]


# --- <obj>.BoolVariation("KEY", ...) -> @treated
#
# The key is matched through a WILDCARD child of the string literal, not by
# naming the content node. That is deliberate and is the only shape that works:
# Piranha's bundled Go grammar has no `interpreted_string_literal_content` (the
# name the current grammar uses) and capturing the literal WHOLE is useless
# because its text includes the quotes — and `#eq?` cannot be handed a value
# containing a `"`. Writing `(#eq? @flag_name "\"KEY\"")` fails with
# `Wrong number of arguments to #eq? predicate. Expected 2, got 4.`: the query
# parser does not honour the escape, it splits on the raw quote.
#
# `(_)` binds the sole named child of an escape-free literal. It cannot bind an
# escape sequence for a key this tool accepts, because `ensure_supported_key`
# already restricts keys to [A-Za-z0-9_-]. Verified positively AND negatively:
# the right key matches, a different key does not.
#
# Both callee shapes are accepted so a dot-imported or re-exported helper is
# covered, exactly as in ts.toml. `#eq?` throughout and never `#any-of?`, which
# Piranha's bundled tree-sitter silently ignores — an ignored predicate does not
# fail the query, it just stops constraining it, which would leave the callee
# unconstrained and rewrite any call whose first argument is the flag key.
[[rules]]
name = "replace_boolvariation_read_with_boolean_literal"
query = """(
  (call_expression
    function: [(selector_expression field: (field_identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (interpreted_string_literal (_) @flag_name))
  ) @call
  (#eq? @sdk_fn "BoolVariation")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]


# --- <obj>.Boolean(ctx, "KEY", ...) AS A WHOLE STATEMENT -> deleted
#
# The OpenFeature counterpart of `delete_discarded_boolvariation_statement`
# above, and it exists for the same reason that one does: Go will not let a
# value be discarded, so folding a warm-up read to a bare `true` yields
# `true (untyped bool constant) is not used`, the engine's self-check rejects
# the transform, and the flag is refused on every run forever (#2691). Adding
# the `Boolean` read rule WITHOUT this one would re-create that defect for a
# new shape.
#
# THIS RULE MUST STAY ABOVE
# `replace_openfeature_boolean_read_with_boolean_literal`, for the same reason
# its BoolVariation twin must stay above its own. Declared second it never
# fires, because the read has already become a literal by the time it is
# reached.
#
# Same two filters and the same safety argument as the twin, and the same
# second-argument anchor as the OpenFeature read rule below.
[[rules]]
name = "delete_discarded_openfeature_boolean_statement"
query = """(
  (expression_statement
    (call_expression
      function: [(selector_expression field: (field_identifier) @sdk_fn)
                 (identifier) @sdk_fn]
      arguments: (argument_list
        . (_)
        . (interpreted_string_literal (_) @flag_name)))) @statement
  (#eq? @sdk_fn "Boolean")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "statement"
replace = ""
holes = ["stale_flag_name"]

[[rules.filters]]
contains = """((argument_list) @arg_list)"""
at_most = 1

[[rules.filters]]
not_contains = ["""((unary_expression) @receive_or_negation)"""]


# --- <obj>.Boolean(ctx, "KEY", ...) -> @treated   (OpenFeature Go client)
#
# The read a customer of `packages/openfeature-go` actually writes. It is the
# OpenFeature CLIENT's method, not our provider's `BooleanEvaluation` — that is
# our side of the contract and is never a call site.
#
# TWO THINGS ARE DIFFERENT HERE FROM EVERY OTHER LANGUAGE'S OPENFEATURE RULE,
# and both are Go conventions rather than choices:
#
# 1. THE KEY IS THE SECOND ARGUMENT. Go takes `context.Context` first
#    (`Boolean(ctx, flag, defaultValue, evalCtx)`), where the TS, Python and C#
#    clients all put the key first. So the anchor is `. (_) .` — first named
#    child is anything, the string literal is immediately after it — rather
#    than the `. (interpreted_string_literal …)` the BoolVariation rule above
#    uses. Copying that rule's anchor across would silently match nothing: the
#    query stays valid, so there is no error, just a read left live.
#
# 2. IT PINS `Boolean`, NOT `BooleanValue`. The OpenFeature Go client spells
#    the same read twice: `BooleanValue(...) (bool, error)` and
#    `Boolean(...) bool`, the latter being the error-swallowing convenience
#    form. Only the single-value form is substitutable — `enabled, err :=
#    client.BooleanValue(...)` folds to `enabled, err := true`, which is not
#    valid Go. This is the same judgement ts.toml makes when it declines the
#    un-awaited call: match only what can be safely stood in for, and leave the
#    rest to the refusal path. `openfeature_untouched_shapes` holds the
#    two-value form precisely so that stays true.
#
# `#eq?` is exact, so pinning `Boolean` cannot match `BooleanValue` or
# `BooleanValueDetails`.
[[rules]]
name = "replace_openfeature_boolean_read_with_boolean_literal"
query = """(
  (call_expression
    function: [(selector_expression field: (field_identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (_)
      . (interpreted_string_literal (_) @flag_name))
  ) @call
  (#eq? @sdk_fn "Boolean")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]

# ===========================================================================
# 2. `} else if <read> { … }` with no trailing `else` — the engine's rule
# ===========================================================================

# This file used to carry its own `delete_trailing_else_if_false`. The engine
# ships one under the same name, and a rule declared here WINS a name
# collision, so ours shadowed it. Ours was the narrower of the two: it matched
# only a bare `false` condition, so a parenthesised `} else if (<read>) {`
# fell through to the built-in that deletes the inner `if` alone, left a
# dangling `else`, and the engine aborted the whole file on its own syntax
# check. It also lacked the guard on the inner `if`'s initializer, which the
# engine's version declines on (the initializer runs whatever the condition
# says, so deleting the branch would delete a call).
#
# Do not re-add it. A cleanup rule that needs to change belongs in the engine,
# where one copy is authoritative; `test_declares_no_cleanup_rules` refuses a
# re-add by name.
