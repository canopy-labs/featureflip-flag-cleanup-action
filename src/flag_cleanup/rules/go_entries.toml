# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`"k": false,`), a test's override entry (`{"k": true}`), a
# plain flag -> value map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see go.toml). It is allowed
# here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves.
#
# Note the anchors, which are TWO different requirements. The leading `.` on
# `keyed_element` is positional (`literal_element : literal_element`), so
# without it a string VALUE equal to the key would match. The PAIR of anchors
# inside the literal — `(interpreted_string_literal .
# (interpreted_string_literal_content) @flag_name .)` — is what makes the
# comparison a WHOLE-KEY comparison: an escape splits the literal, so
# `"old-checkout\x41"` parses as a content child of exactly `old-checkout`
# followed by an `escape_sequence`, and the single-child form deleted an entry
# whose key is `old-checkoutA` (measured). The quotes are anonymous nodes,
# which anchors ignore, so the plain literal still matches; `escaped` in the
# fixture pins it.
#
# gofmt's multi-line map alignment is NOT restored: the engine deletes the
# whole line, so the survivors keep the column widths the deleted key set. Run
# gofmt on the branch — see the Go section of the README.

# ===========================================================================
# Composite literal elements: `map[string]T{"k": …}`
# ===========================================================================

# STUB PRONG — the value is a boolean literal: a test override, or a plain
# flag -> value map. May empty its literal (`{"k": true}` -> `{}`), which is
# the right shape for an override.
[[rules]]
name = "delete_flag_keyed_boolean_element"
query = """(
  (keyed_element
    . (literal_element (interpreted_string_literal . (interpreted_string_literal_content) @flag_name .))
    . (literal_element [(true) (false)])) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name"]

# REGISTRY PRONG — another element in the SAME literal is keyed by a different
# flag of this project, so the literal is a flag-keyed map. The evidence cannot
# be satisfied by the target's own key; sibling evidence inside the target's
# own VALUE is accepted, because `contains` searches the whole subtree and a
# nested flag map is still a flag map. So this prong CAN empty a literal whose
# sole element nests another flag key — measured, and the same trade the stub
# prong makes.
[[rules]]
name = "delete_flag_keyed_registry_element"
query = """(
  (keyed_element
    . (literal_element (interpreted_string_literal . (interpreted_string_literal_content) @flag_name .))) @entry
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "known_flag_keys"]

[[rules.filters]]
enclosing_node = "(literal_value) @registry"
contains = """(
  (keyed_element
    . (literal_element (interpreted_string_literal . (interpreted_string_literal_content) @sibling .)))
  (#any-of? @sibling @known_flag_keys)
)"""
at_least = 1
