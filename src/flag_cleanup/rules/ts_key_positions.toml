# Templates for an accessor whose key is not its first argument, for
# TypeScript, TSX and JavaScript: `get[1]` in the `accessors` input is
# `get(obj, "KEY", …)`, lodash's and redux-saga's argument order.
#
# Never run as written, and never staged into the engine's config directory:
# `rule_synthesis.with_accessors` clones the block once per such accessor, with
# `__ACCESSOR_TEMPLATE__` replaced by the accessor's name and `__KEY_POSITION__`
# by one anchored wildcard per argument before the key. A plain accessor is
# never cloned from here: matching the key at any position would fold every
# call that passes the key string, which the first-argument anchor in `ts.toml`
# exists to prevent.
#
# The callee shape is `replace_boolvariation_read_with_boolean_literal`'s, with
# the optional-chaining exclusions written there.

[[rules]]
name = "accessor_template__key_at_position"
# accessor-template: key-position
query = """(
  (call_expression
    function: [(member_expression !optional_chain property: (property_identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (arguments
      . __KEY_POSITION__(string . (string_fragment) @flag_name .))
  ) @call
  (#eq? @sdk_fn "__ACCESSOR_TEMPLATE__")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]

[[rules.filters]]
not_contains = ["""((call_expression "?." arguments: (arguments)) @optional_call)"""]

# A spread argument (`get(...args, "KEY")`) occupies an unknown number of
# slots, and a comment is a named child of `arguments` that the wildcards would
# count as an argument (`pick(s, /* why */ "KEY")` has the key at index 3, not
# 2). Either one anywhere in the call, nested calls included, leaves it alone.
[[rules.filters]]
not_contains = ["""((spread_element) @spread)"""]

[[rules.filters]]
not_contains = ["""((comment) @comment)"""]

# --- The property form: `getFlag{key}` is `await getFlag({ ..., key: KEY, ... })`.
# `rule_synthesis.with_accessors` clones this block once per such accessor, with
# `__KEY_PROPERTY__` (and `__KEY_PROPERTY_RE__`, the same name as regex source)
# replaced by the property's name. It is narrower than the first-argument and
# positioned reads on purpose:
#
# * AWAITED only, matched at the `await_expression`. Nothing proves the read is
#   not a Promise (`ts_async_reads` decides per site for first-argument
#   accessors and does not see this one), and `await true` is what the
#   expression becomes anyway, so the await goes with the call.
# * The call is replaced whole, so every other property is dropped with it. The
#   object is admitted by a WHITELIST over its text (four predicates, written
#   once in `ts_syntax.object_tokens`, `OBJECT_ADJACENT`, `OBJECT_KEYWORDS` and
#   `object_duplicate_key`): only literals, plain names and nested objects and
#   arrays of those, exactly one property named like the key, no `__proto__`.
#   The structural filters add what text cannot see: spread, comment, computed
#   name, optional call. `key_const.py`/`cross_file_ts.py` decline the same
#   objects (`ts_syntax.declined_by_object_key_rules`); a test runs both.

[[rules]]
name = "accessor_template__key_in_property"
# accessor-template: key-property
query = """(
  (await_expression
    (call_expression
      function: [(member_expression !optional_chain property: (property_identifier) @sdk_fn)
                 (identifier) @sdk_fn]
      arguments: (arguments
        . (object
            (pair key: (property_identifier) @key_prop
                  value: (string . (string_fragment) @flag_name .))) @key_object .))
  ) @await
  (#eq? @sdk_fn "__ACCESSOR_TEMPLATE__")
  (#eq? @key_prop "__KEY_PROPERTY__")
  (#eq? @flag_name "@stale_flag_name")
  (#match? @key_object "^(?:[ \\\\t\\\\r\\\\n]|[{},:\\\\[\\\\]]|[A-Za-z0-9_$]+|'[A-Za-z0-9_$./:@#%+=-]*'|\\"[A-Za-z0-9_$./:@#%+=-]*\\")*$")
  (#not-match? @key_object "[A-Za-z0-9_$][ \\t\\r\\n]+[A-Za-z0-9_$]")
  (#not-match? @key_object "[A-Za-z0-9_$'\\\\\\"\\\\]][ \\\\t\\\\r\\\\n]*\\\\[")
  (#not-match? @key_object "(?:^|[ \\\\t\\\\r\\\\n{,:\\\\[])(?:this|super|class|function|async|import|await|yield|new)(?:[ \\\\t\\\\r\\\\n{},:\\\\]]|$)|__proto__")
  (#not-match? @key_object "(?s)[{,][ \\t\\r\\n]*(?:__KEY_PROPERTY_RE__|'__KEY_PROPERTY_RE__'|\\"__KEY_PROPERTY_RE__\\")[ \\t\\r\\n]*(?:[:}].*[{,]|,(?:.*[{,])?)[ \\t\\r\\n]*(?:__KEY_PROPERTY_RE__|'__KEY_PROPERTY_RE__'|\\"__KEY_PROPERTY_RE__\\")[ \\t\\r\\n]*[:,}]")
)"""
replace_node = "await"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]

[[rules.filters]]
not_contains = ["""((call_expression "?." arguments: (arguments)) @optional_call)"""]

[[rules.filters]]
not_contains = ["""((spread_element) @spread)"""]

[[rules.filters]]
not_contains = ["""((comment) @comment)"""]

[[rules.filters]]
not_contains = ["""((computed_property_name) @computed)"""]
