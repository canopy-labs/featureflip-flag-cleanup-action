# Piranha flag-cleanup rules for Kotlin (android SDK).
#
# Seed rules only, and few of them, because a Python pre-pass has already
# done the part the engine cannot. Read
# `src/flag_cleanup/kotlin_sentinel.py` before changing anything here.
#
# Holes filled per invocation via substitutions:
#   @sentinel -> the unique identifier the pre-pass substituted for the callee
#   @treated  -> "true" | "false"
#
# Note what is NOT here: no `@stale_flag_name`. The key never reaches these
# rules — not because it structurally can't anymore, but because this file
# deliberately keeps not routing it there. HISTORY: Piranha's OLD bundled
# Kotlin grammar (the danieltrt fork, dropped in the 0.5.0 migration — see the
# M4 section of ../../CLAUDE.md) gave `string_literal` NO named children
# whatsoever — `((string_literal (_) @in) @lit)` returned no match and
# `string_content` was not even a known node type — so there was nothing for
# `#eq?` to compare against, and capturing the literal whole failed too
# because `#eq?` cannot take a value containing a `"`.
#
# UPDATE (0.5.0, tree-sitter-kotlin-ng): re-verified against the new bundled
# grammar and the wall is GONE. `string_literal` now has a real
# `string_content` child (confirmed via node-types.json and by probing the
# installed wheel directly), and `#eq?` matches its text — a direct rule like
# `((call_expression (navigation_expression (_) (identifier) @m)
# (value_arguments (value_argument (string_literal (string_content) @k))))
# (#eq? @m "boolVariation") (#eq? @k "@stale_flag_name"))` DOES fire (measured
# against a real `client.boolVariation("key", false)` call, no sentinel
# involved). So a `java.toml`-shaped direct rule set is now technically
# possible for Kotlin.
#
# Deliberately NOT done here. The sentinel pre-pass used to earn its keep on a
# second axis too — it backed a refusal of the "dead `else if` deletes the live
# branch ahead of it" engine defect — but 0.7.0 fixed that defect upstream
# (piranha#32/#33) and the refusal is gone with it. What remains is still
# enough: cutting over to direct rules would mean re-proving the
# `!`-precedence workaround from scratch against string-literal-keyed rules
# instead of the already-proven, already-tested sentinel path, for no
# behavioural gain. Treat this file's not-taking of the direct-rule shortcut as
# a decision, not an oversight.
#
# The pre-pass resolves the key with the wheel-installed tree-sitter-kotlin
# grammar (a third, independently-versioned grammar from either of the above
# — see `kotlin_sentinel`'s module docstring — and unaffected by the 0.5.0
# engine-grammar migration) and rewrites just the callee:
#
#   client.boolVariation("old-checkout", false)
#   -> __ff_cleanup_<hash>("old-checkout", false)
#
# leaving the engine a bare identifier callee to match, which is the one shape
# it CAN constrain.


# ===========================================================================
# 1. The flag read (already marked by the pre-pass)
# ===========================================================================

# --- @marker(<literal>) — a private helper's parameter, inlined after the engine
#
# Not an SDK shape: like `ts.toml`'s rule of the same name, it matches only
# something THIS TOOL wrote. When every call of a private helper passes the same
# literal the fold produced at one position, `private_constant_params` deletes
# the argument and the parameter and writes a call to this marker at each read
# of it. The engine then runs again and this rule creates the literal INSIDE the
# cascade, so the `if` it guards folds as a read written inline would. The
# marker carries its value as its argument: a call passing the opposite of the
# treatment keeps its own literal. A marker the engine leaves behind unwinds the
# file. The callee is captured as `@inlined_callee` (not an SDK name, and no
# capture may start with a hole's name).
#
# Kotlin has no boolean node in this grammar (`true` is an `identifier`), so the
# value is matched by text. A read under `!` is never written as `!marker(v)`,
# which this grammar would parse as `(!marker)(v)`: the inliner folds the
# negation into the value instead.
#
# The callee is the marker with an `inlined` prefix, never the bare marker: the
# marker and the wrapper SENTINEL are the same identifier (both derive from the
# key), and the sentinel rule replaces any call of it with `@treated`, whatever
# its argument. Measured in Kotlin with the bare marker below that rule:
# `if (!on)`, inlined as `marker(false)`, came out `if (true)` under the true
# treatment. Above it, a wrapper call passing one boolean literal
# (`flags.on(true)`, marked as `sentinel(true)`) would fold to that argument
# instead of the flag's value. A hole is substituted as text, so
# `"inlined@marker"` is `inlined` followed by the marker (a suffix would not
# work: `@marker_param` reads as a hole named `marker_param`).
[[rules]]
name = "replace_inlined_binding_marker_with_boolean_literal"
query = """(
  (call_expression
    . (identifier) @inlined_callee
    . (value_arguments . (value_argument . (identifier) @value .) .)
  ) @call
  (#eq? @inlined_callee "inlined@marker")
  (#match? @value "^(true|false)$")
)"""
replace_node = "call"
replace = "@value"
groups = ["replace_expression_with_boolean_literal"]
holes = ["marker"]


# --- @sentinel(…) AS A STATEMENT WHOSE VALUE IS DISCARDED -> deleted
#
# A warm-up read made for the SDK's own exposure event, or a wrapper call made
# only for its value's sake. Kotlin, unlike Java, accepts a bare `true` as an
# expression statement, so the fold below "works" here and leaves dead code
# behind instead of a refusal. This rule deletes the statement instead.
#
# THE POSITION IS THE WHOLE SAFETY ARGUMENT. In Kotlin the last statement of a
# lambda, and of an `if`, `when` or `try` branch, is that construct's VALUE, so
# a read there may flow anywhere. This rule matches only where a statement's
# value cannot be used:
#   * a statement of a block or lambda that has another statement AFTER it
#     (a comment after it does not count: the trailing `(statement)` is a
#     statement node, and a lambda ending `read() // c` keeps its value);
#   * any statement of a function body (`{ … }`, never `= …`), an `init`
#     block or a loop body, none of which has a value;
#   * a statement of an `if` with no `else`, whose value is `Unit` wherever it
#     stands.
# Everywhere else (an argument, an elvis operand, an assignment, a `return`, a
# condition, an unbraced body) the read is not a direct statement of one of
# those containers, so the query does not reach it and the fold below runs.
#
# The arguments are not checked, unlike Java's rule. Here the alternative to
# deleting is the fold to a bare literal, which drops the arguments just the
# same, so a filter would keep `true` standing and save nothing.
#
# MUST STAY ABOVE `replace_sentinel_read_with_boolean_literal`: seed rules fire
# in declaration order, and that rule rewrites the call this one deletes.
# Declared second, it never fires and the bare literal comes back.
[[rules]]
name = "delete_discarded_sentinel_statement"
query = """(
  [
    (block (call_expression (identifier) @sdk_fn) @call (statement))
    (lambda_literal (call_expression (identifier) @sdk_fn) @call (statement))
    (function_body (block (call_expression (identifier) @sdk_fn) @call))
    (anonymous_initializer (block (call_expression (identifier) @sdk_fn) @call))
    (for_statement (block (call_expression (identifier) @sdk_fn) @call))
    (while_statement (block (call_expression (identifier) @sdk_fn) @call))
    (do_while_statement (block (call_expression (identifier) @sdk_fn) @call))
    (if_expression condition: (_) . (block (call_expression (identifier) @sdk_fn) @call) .)
  ]
  (#eq? @sdk_fn "@sentinel")
)"""
replace_node = "call"
replace = ""
holes = ["sentinel"]


# --- @sentinel(…) -> @treated
#
# GRAMMAR UPDATE (0.5.0: tree-sitter-kotlin-ng replaces the danieltrt fork —
# see the M4 section of ../../CLAUDE.md): `simple_identifier` is gone,
# unified into plain `identifier`. `(call_expression (identifier) @sdk_fn)`
# is the bare-callee form. Measured, and the choice is not free: the sibling
# shape `(navigation_expression (identifier) @f)` binds the RECEIVER rather
# than the method (verified empirically against the 0.5.0 wheel, same as
# before the migration), so `#eq?` on it never matches. Rewriting the callee
# to a bare identifier is what sidesteps all of it.
#
# The arguments are deliberately unconstrained. They still hold the original
# key, but this rule does not need to look: the pre-pass has already proved the
# key matched, and it only ever writes this identifier over a call it proved.
# `#eq?` on `@sentinel` is therefore an exact, engine-side re-check that the
# identifier is ours and not something the customer happens to have written —
# and `kotlin_sentinel.rewrite` refuses to run at all over a file that already
# contains the name, so the two checks cannot disagree.
#
# `#eq?` and never `#any-of?`. UPDATE (0.5.0): `#any-of?` is now HONOURED by
# the engine (measured — see `test_an_ignored_predicate_does_not_constrain`'s
# docstring in `tests/test_piranha_rules.py`), where earlier engine versions
# silently ignored it. That makes the old "silently ignored" hazard this
# comment used to warn about unnecessary rather than dangerous. `#eq?` stays
# the choice anyway: it is the exact-match guarantee this rule needs (one
# sentinel per invocation), and `#any-of?` would buy nothing here even though
# it would now work. `test_rules_use_no_ignored_predicates` still fails the
# build if `#any-of?` appears in an uncommented rule line.
[[rules]]
name = "replace_sentinel_read_with_boolean_literal"
query = """(
  (call_expression (identifier) @sdk_fn) @call
  (#eq? @sdk_fn "@sentinel")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "sentinel"]

# --- !@sentinel(…) -> !@treated
#
# UPSTREAM GRAMMAR BUG (tree-sitter-grammars/tree-sitter-kotlin #3, open,
# unfixed): a prefix `!` immediately before a postfix chain binds to the
# RECEIVER instead of the whole chain. This bites even a bare, receiver-less
# call: `!sentinel(k, false)` parses as `(!sentinel)(k, false)` — confirmed
# empirically against the 0.5.0 wheel by probing `(call_expression) @top`
# against `val r = !sentinel_id("k", false)`, which matched (and replaced)
# the WHOLE `!sentinel_id("k", false)` span, while
# `(call_expression (identifier) @sdk_fn)` (the base rule above) does NOT
# match it at all — the callee positioned there is a `unary_expression`
# wrapping the identifier, not a bare `identifier`.
#
# Left unhandled, the sentinel would simply never be consumed for a negated
# read: `kotlin_sentinel.survived()` would see it still in the output and the
# whole file would be refused. Fixed the same way the fork's own port fixes
# it (see `replace_isToggleEnabled_with_boolean_literal_negated` and friends
# in the piranha fork's kt test-resource rules, and
# `test_kotlin_boolean_simplification_negated_flag_read` in its
# tests/test_piranha.py): a companion rule matching the `!`-inclusive call
# and replacing the WHOLE thing — receiver-`!` included — with the literal
# text `!@treated`, so the leading `!` survives textually and the engine's
# own `simplify_not_true`/`simplify_not_false` (reachable via the same
# `boolean_expression_simplify` group this rule's edge already feeds) folds
# it on the next pass. Listed BEFORE the base rule for readability/symmetry
# with the fork's layout; not load-bearing here either — this rule's
# `unary_expression`-callee shape and the base rule's bare-`identifier`-callee
# shape are mutually exclusive on the same `call_expression`, so declaration
# order cannot change which one a given call matches.
[[rules]]
name = "replace_sentinel_read_with_boolean_literal_negated"
query = """(
  (call_expression (unary_expression operator: "!" argument: (identifier) @sdk_fn)) @call
  (#eq? @sdk_fn "@sentinel")
)"""
replace_node = "call"
replace = "!@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "sentinel"]


# ===========================================================================
# 2. Everything else is Piranha's own
# ===========================================================================
# Kotlin has built-in feature-flag cleanup rules and they are the most complete
# of any language here — MORE complete than Swift's. Verified end to end on a
# sentinel-ified file, both treatments:
#
#   * `if (<read>) { … }` folds, with or without an `else`;
#   * `!<read>` simplifies;
#   * `return if (<read>) a() else b()` collapses to the surviving branch;
#   * `val enabled = <read>` is INLINED and its declaration deleted — the job
#     `ts_const.toml` plus Gate 2 do by hand for TypeScript, and the one Swift
#     does not do at all.
#
# So no cleanup rule of ours is needed for those: the seed rule's
# `replace_expression_with_boolean_literal` group is what the built-in graph
# already keys off, and `kt_edges.toml` adds only a few edges onto it.
#
# The `else if (<read>)`-with-no-trailing-else gap that costs Java, Go and
# TypeScript a bespoke rule has not been reproduced here. Do NOT assume it is
# absent — it has not been probed, and if it turns up the fix will look like
# java.toml's (rebuild the outer `if` from captures), not TypeScript's.
