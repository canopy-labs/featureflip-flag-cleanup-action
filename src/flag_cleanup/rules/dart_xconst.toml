# Blocks marked `# xconst: enum-qualified-field` match a read through an enum
# entry's field or getter (`Owner.entry.key`), and `# xconst:
# enum-qualified-call` one through a method with no arguments
# (`Owner.entry.flagKey()`), with __XCONST_ACCESSOR__ replaced by the member's
# name. The WHOLE key expression's text is matched, so an owner of any depth
# (`Flags`, `p.Flags`) needs no further shape, and a read spelled with
# whitespace or a comment inside it is left standing.

[[rules]]
# xconst: enum-qualified-field
name = "xconst_enum_field_boolvariation_read"
query = """(
  [(call_expression
      function: (member_expression property: (identifier) @sdk_fn)
      arguments: (arguments . (member_expression) @key_ref))
   (call_expression
      function: (identifier) @sdk_fn
      arguments: (arguments . (member_expression) @key_ref))] @call
  (#eq? @sdk_fn "boolVariation")
  (#eq? @key_ref "__XCONST_OWNER__.__XCONST_MEMBER__.__XCONST_ACCESSOR__")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated"]

[[rules]]
# xconst: enum-qualified-field
name = "xconst_enum_field_boolvariation_read_after_comment"
