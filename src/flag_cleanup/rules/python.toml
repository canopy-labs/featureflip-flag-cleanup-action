# Piranha flag-cleanup rules for Python (python SDK).
#
# Like java.toml and go.toml, this file carries ONLY the seed rules. The
# boolean simplification, the `if` fold and the statement cleanup all come from
# the engine's own `cleanup_rules/python`, reached over the edges in
# python_edges.toml — which name GROUPS, not rules, so the engine's rules answer
# them.
#
# It did carry the whole cascade, because the engine shipped none for Python.
# That stopped being true at engine 0.6.0, which upstreamed this file's cleanup
# half verbatim, and for a while both copies existed. A user rule wins a name
# collision, so ours shadowed the engine's and the engine's 21 rules were dead
# weight — until one of them was fixed and ours was not, which is exactly how
# the TypeScript parenthesis defect survived in the engine while the fix sat
# downstream. The shadowing half is gone; see the note at the end of this file.
#
# Holes filled per invocation via substitutions:
#   @stale_flag_name -> the flag key (matched against the first string-literal arg)
#   @treated         -> "True" | "False"   (NOT lowercase — see below)
#
# Two things make Python different from every other language here, and both
# shape the rules rather than merely decorating them.
#
# 1. THE ENGINE CANNOT RE-INDENT. Measured against 0.4.8: replacing an
#    `if_statement` with the statements of its block pastes the first line at
#    the `if`'s column and leaves every later line at its ORIGINAL column, and
#    capturing the whole `(block)` instead leaves every line over-indented.
#    Both produce source CPython rejects. So the cascade has no `*_splice`
#    rule at all — not here and not in the engine's copy, which inherited this
#    constraint with the rules. A branch is folded only when it is a SINGLE
#    SIMPLE STATEMENT, which needs
#    no re-indentation because only its first line moves. A multi-statement
#    branch is left alone, and the residual-condition gate in `syntax.py` then
#    refuses the file rather than shipping `if True:` as a "removal".
#
# 2. THE SDK HAS NO BOOLEAN-SPECIFIC READ. `variation(key, context, default)`
#    is generic over the flag's type, so the call alone is no evidence that the
#    flag is a boolean — folding a string or JSON flag to `True` would be a
#    silent type change. The seed rules therefore require the `default`
#    argument to be a boolean LITERAL, which is the only type evidence the call
#    site carries. `variation("k", ctx, "control")` is left alone.
#
# `@treated` is pasted as TEXT, so it must be spelled `True`/`False`. The
# engine will happily emit `if true:` — a NameError at run time, not a syntax
# error, so it survives every parse check this tool has. See
# `piranha_runner._Language.true_literal`.


# ===========================================================================
# 1. The flag read — the only rules this file still declares
# ===========================================================================

# --- <obj>.variation("KEY", ctx, <bool literal>) -> @treated
#
# The key is matched through `(string (string_content) @flag_name)`.
# `string_content` is the node holding the text WITHOUT its quotes, and it must
# be reached that way because `#eq?` cannot be handed a value containing a `"`:
# `(#eq? @flag_name "\"KEY\"")` fails with *Wrong number of arguments to #eq?
# predicate. Expected 2, got 4* — the query parser does not honour the escape,
# it splits on the raw quote. Verified both ways: the right key matches, a
# different key does not.
#
# THE ANCHORS ARE LOAD-BEARING, not tidiness. `variation`'s signature is
# `(key, context, default, track=True)`, so a bare "there is a boolean
# somewhere in the argument list" would match
# `variation("KEY", ctx, fallback, False)` — where the boolean is `track` and
# the default is a variable of unknown type — and fold a possibly-non-boolean
# flag. `. (string …) . (_) . [(true) (false)]` pins the literal to the THIRD
# positional argument. Measured: that call is left alone, and
# `variation("KEY", ctx, "control")` with a string default is too.
#
# `variation_detail` returns an EvaluationDetail rather than the value, so
# folding it to a literal would be a type error; `#eq?` is exact, so the longer
# name simply does not match.
#
# `#eq?` throughout and never `#any-of?`, which Piranha's bundled tree-sitter
# silently ignores — an ignored predicate does not fail the query, it just
# stops constraining it, which would leave the callee unconstrained and rewrite
# any call whose first argument is the flag key. See ts.toml for the full
# account; `test_rules_use_no_ignored_predicates` fails the build if it returns.
[[rules]]
name = "replace_variation_read_with_boolean_literal"
query = """(
  (call
    function: [(attribute attribute: (identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (string (string_content) @flag_name)
      . (_)
      . [(true) (false)])
  ) @call
  (#eq? @sdk_fn "variation")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]

# --- <obj>.variation("KEY", ctx, default=<bool literal>) -> @treated
#
# The keyword form needs its own rule because the argument is a
# `keyword_argument` node rather than the literal itself, and because it may
# sit anywhere in the list (`variation("KEY", context=ctx, default=False)` is
# ordinary). The name is pinned with `#eq? @kw "default"`, which is what stops
# `variation("KEY", ctx, fallback, track=False)` from matching — `track` is
# also a keyword argument with a boolean value, and it says nothing about the
# flag's type. Measured: that call is left alone, as is `default=fallback`.
#
# Only the KEY is anchored (`.`), because the keyword may legitimately follow
# any number of positional arguments.
[[rules]]
name = "replace_variation_keyword_read_with_boolean_literal"
query = """(
  (call
    function: [(attribute attribute: (identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (string (string_content) @flag_name)
      (keyword_argument
        name: (identifier) @kw
        value: [(true) (false)]))
  ) @call
  (#eq? @sdk_fn "variation")
  (#eq? @kw "default")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]


# --- <obj>.get_boolean_value("KEY", default, ctx) -> @treated
# The OpenFeature Python provider (`featureflip-openfeature-provider`). The read
# comes from the `openfeature-sdk` client, not from our provider, so neither
# `variation` rule above matches it.
#
# This client is SYNCHRONOUS — `get_boolean_value` returns a `bool` directly —
# so unlike the JS and .NET providers there is no `await` to account for and
# this is an ordinary call replacement. (`openfeature-python`'s README
# quickstart is the reference shape: `client.get_boolean_value("new-checkout",
# False, EvaluationContext(...))`.)
#
# Only the FIRST argument is anchored, and deliberately: unlike `variation`,
# which serves every flag type and therefore needs a boolean-literal default to
# prove the read is a boolean one, `get_boolean_value` is type-specific by name.
# Constraining the default as well would only lose reads that pass a variable
# default, which are just as safe to fold. A keyword-form key
# (`get_boolean_value(flag_key="...")`) never binds `string`, so it is left
# alone — conservative, and consistent with every other rule here.
[[rules]]
name = "replace_get_boolean_value_read_with_boolean_literal"
query = """(
  (call
    function: [(attribute attribute: (identifier) @sdk_fn)
               (identifier) @sdk_fn]
    arguments: (argument_list
      . (string (string_content) @flag_name))
  ) @call
  (#eq? @sdk_fn "get_boolean_value")
  (#eq? @flag_name "@stale_flag_name")
)"""
replace_node = "call"
replace = "@treated"
groups = ["replace_expression_with_boolean_literal"]
holes = ["treated", "stale_flag_name"]


# --- <marker>(True|False) -> that literal
#
# Not an SDK shape, and the only rule in this directory that matches something
# THIS TOOL wrote. `python_fold.inline_literal_bindings` resolves a read bound
# to a local (`use_legacy = client.variation(...)` plus `if use_legacy:`), which
# no rule can do — the useful edit DELETES the binding and rewrites its
# references, two edits in different places — so it runs after the engine, with
# the whole file in hand.
#
# That placement is exactly what broke (#3029). Piranha's cascade is driven by
# EDGES FROM THE RULE THAT CREATED A LITERAL, so a literal written by Python
# code after the engine has exited has no edge to travel: `use_legacy or other`
# became `True or other` and stopped there, while the identical read written
# inline folded all the way to `True`. Five operand positions diverged —
# `x or _`, `x and _`, `not x`, a ternary condition, and a three-term chain —
# and the fold left a dead guard reading as live code under a pull request
# saying the flag was removed.
#
# So the inliner substitutes a CALL TO THIS MARKER rather than the literal, and
# the engine is run again. This rule then creates the literal INSIDE the
# cascade, where the edges apply, and a bound read becomes indistinguishable
# from a direct one — which is the property
# `test_a_bound_read_folds_exactly_like_a_direct_one` asserts as a relation
# rather than against expected bytes. The alternative was re-implementing
# `boolean_expression_simplify` in Python, i.e. a second copy of the engine's
# cascade: the arrangement that kept the TypeScript parenthesis defect alive in
# the engine for a full release because the downstream copy was the one
# actually running.
#
# The marker CARRIES its value as its only argument instead of folding to
# `@treated`, and that is load-bearing rather than tidy: the value is not
# always the treatment. `x = not <read>` folds to `x = False` under
# `treated=true`, so a marker hard-wired to `@treated` would put `True` back
# and invert the flag.
#
# `@marker` is `__ff_cleanup_<sha256(key)[:16]>` — the same reserved-looking
# shape `kotlin_sentinel` uses, and unreachable from real source by the same
# argument. Be precise about what that buys, because this rule is live on
# EVERY pass and not only the second: a file that genuinely contained
# `__ff_cleanup_<the right digest>(True)` would have it rewritten to `True`,
# an unrequested edit. That is the exposure Kotlin's sentinel already carries,
# accepted here for the same reason (a SHA-256 prefix keyed on the flag).
# What the guards cover is the other direction, which is the one that ships
# broken code: the inliner declines a file that already contains the marker,
# because "did a marker survive the engine?" cannot then tell ours from
# theirs; `_inline_bound_reads` unwinds a file where one survives anyway; and
# Gate 1 refuses one that reaches it regardless. A surviving marker parses, so
# nothing downstream of the syntax check could see it.
[[rules]]
name = "replace_inlined_binding_marker_with_boolean_literal"
query = """(
  (call
    function: (identifier) @sdk_fn
    arguments: (argument_list . [(true) (false)] @value .)
  ) @call
  (#eq? @sdk_fn "@marker")
)"""
replace_node = "call"
replace = "@value"
groups = ["replace_expression_with_boolean_literal"]
holes = ["marker"]


# ===========================================================================
# 2. Everything after the read belongs to the engine
# ===========================================================================
#
# `boolean_expression_simplify`, `if_cleanup` and `statement_cleanup` used to be
# declared here, 21 rules of them. They are gone because the engine ships the
# same 21 — same names, same queries, same filters, same replacements, and the
# same three edges — so every one of them was shadowed and unreachable. Checked
# by parsing both files rather than by eye, against the pinned engine version.
#
# What that means when something here misbehaves: the rule you are looking for
# is in the engine, not in this directory. `python_edges.toml` is deliberately
# kept even though the engine declares identical edges — edges MERGE rather than
# collide, so a local copy adds a guarantee instead of hiding one, and it keeps
# the contract the seed rules above depend on visible at the point of use.
#
# The 15 python fixture cases in `tests/test_piranha_rules.py` are what holds
# this together. They exercise the whole cascade end to end, so an engine bump
# that changed or dropped any of those 21 rules turns them red here rather than
# in a customer's repository. `test_declares_no_cleanup_rules` stops the
# duplicate being reintroduced by hand.
#
# Three things stay downstream and are NOT candidates to follow the rules up:
# the seed rules above (they encode this SDK's call shapes and its
# boolean-literal type evidence), the const-propagation rules and their
# bound-exactly-once pre-flight (the TS/Python families have no
# `scope_config.toml` in the engine), and the post-passes in `python_fold.py` /
# `reindent.py` / `syntax.py` — the engine re-parses its output but never
# type-checks it, and cannot re-indent at all.
