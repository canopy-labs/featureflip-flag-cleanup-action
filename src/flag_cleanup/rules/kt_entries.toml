# Flag-keyed ENTRIES — the residue a read-anchored rule cannot see: the
# registry line (`"k" to false,`), a test's override entry (`mutableMapOf("k"
# to true)`), a plain flag -> value map keyed the same way.
# Design notes: CLAUDE.md, "Flag-keyed entries are RULES, not a Python pass".
#
# Holes: @stale_flag_name (the flag key) and @known_flag_keys — the project's
# OTHER flag keys, rendered by `piranha_runner.render_known_flag_keys` as
# space-separated quoted literals for `#any-of?`. Empty when the list could
# not be fetched, which makes the registry prong match nothing (measured).
#
# `#any-of?` is banned in every other rule file (see kt.toml). It is allowed
# here because the alternatives are runtime data;
# `test_entry_rules_use_any_of_only_against_the_hole` keeps it to exactly this
# one use.
#
# Two prongs per shape. Both may match the same entry; the engine applies one,
# re-parses, and the other no longer matches. No edges: a deleted entry
# cascades to nothing. Every name carries `delete_flag_keyed_`, which is how
# `piranha_runner._flag_keyed_entries` reports them.
#
# NEITHER PRONG DELETES AN ENTRY WHOSE VALUE IS THE BRANCH BEING REMOVED
# (#3050). `@treated` is the literal this run keeps; `@untreated` is its
# complement, and an entry spelled `k -> @untreated` is the customer pinning
# the flag to the branch the fold is deleting — evidence that the code around
# it is about to become dead, not evidence the entry is stale. Stripping one
# turned a test that asserted the removed branch into a test asserting
# behaviour the code can no longer produce. That is strictly worse than
# leaving it alone: a residual reference is visible in the pull-request body,
# a silently falsified test is not (measured on featureflip#3041, where
# `renderProfile({ 'web-two-factor-auth': false })` became `renderProfile({})`
# and the suite went red).
#
# So the STUB prong requires `(#eq? @value "@treated")` and the REGISTRY prong
# carries `(#not-eq? @value "@untreated")`. The second is phrased negatively on
# purpose: the registry prong must keep deleting a value that is not a boolean
# at all, because `k -> { default: false }` is a registry DEFAULT rather than
# an override. The discriminator is the literal's ROLE — a value position the
# entry occupies directly — not the value itself, which is why a nested
# `false` is untouched by this guard.
#
# The decline is reported rather than silent: `contradicting.py` finds the same
# shape with tree-sitter and the pull-request body names it with its reason.
# `test_the_detector_reports_exactly_what_the_rules_declined` is what keeps the
# two from drifting apart.
#
# The engine swallows the entry's comma itself (measured in every position);
# `syntax.collapse_introduced_double_spaces` tidies the space a single-line
# middle deletion leaves.
#
# THE ANCHOR IS THE INFIX `to`, NOT THE CALLEE. Kotlin has no map-literal
# syntax: a map is a CALL, so an entry is a `value_argument` wrapping an
# `infix_expression` whose operator identifier is `to`. Matching on the callee
# instead would mean enumerating `mapOf` / `mutableMapOf` / `hashMapOf` /
# `linkedMapOf` / `sortedMapOf` and whatever a project wrote itself; the `to`
# pair is the shape all of them share, and is what makes an argument an ENTRY
# rather than a positional parameter. `#eq? @operator "to"` is what keeps
# every other infix operator (`shl`, `until`, a project's own `infix fun`)
# out.
#
# THE STUB PRONG IS TWO RULES BECAUSE THIS GRAMMAR HAS NO BOOLEAN NODE
# (measured): the installed tree-sitter-kotlin parses `true` and `false` as
# plain `(identifier)`, and a query naming `boolean_literal` is rejected
# outright — the engine panics with `QueryError { kind: NodeType }` before it
# reads a file. So the boolean-ness of the value is a TEXT test, `#eq? @value
# "true"` / `"false"`, and one rule per value is what the `#any-of?` ban
# prescribes. Reusing `(identifier)` for the operator and the value in the
# same query is safe only because both are pinned by `#eq?`. The two are named
# `delete_flag_keyed_boolean_argument_true` / `…_false` — the prong word first,
# the discriminator appended, as `dart_entries.toml` names its two quote
# styles, so the stub prong is still findable by the word every other language
# in this directory uses for it.
#
# Note the anchors, which are TWO different requirements. The leading `.` on
# the `infix_expression` is positional: its children are ordered, so without it
# a string on the RIGHT of the operator — the value in `"other" to
# "old-checkout"` — would match as if it were the key. The PAIR of anchors
# inside the literal, `(string_literal . (string_content) @flag_name .)`, is
# what makes the comparison a WHOLE-KEY comparison. A `string_literal` may
# carry several named children, and interpolation splits it in either
# direction: `"${prefix}old-checkout"` is `(interpolation)(string_content
# "old-checkout")` and `"old-checkout${s}"` is `(string_content
# "old-checkout")(interpolation)`, so the single-child form deleted BOTH —
# entries whose key merely CONTAINS the flag name (measured). An escape splits
# it too (`"old-checkout\u0041"` parses as three `string_content` children
# here). Requiring the content to be both the first and the last named child
# declines every one of them; `interpolated` in the fixture pins it.
#
# A SOLE ENTRY IS DELETED ONLY WHERE THE CONTEXT FIXES THE MAP'S TYPE.
# Emptying a call removes the only thing its type arguments were inferred
# from: `val m = mutableMapOf("k" to true)` becomes `val m =
# mutableMapOf()`, which does not compile ("cannot infer type for type
# parameter 'K'"). Measured with kotlinc 2.2.20, an emptied builder
# compiles where the expected type supplies both type arguments, and fails
# as the initializer of an unannotated `val`/`var`, under a declared type
# with no type arguments (`Any`, `Any?`, and a `typealias` looks the same
# to a query), under a star projection (`Map<*, *>`), as the argument of a
# generic function, and as the argument of a call whose overloads differ
# only in map type. So a sole entry is deleted only in three
# positions enumerated POSITIVELY, each on a standard-library builder
# (`mapOf`, `mutableMapOf`, `hashMapOf`, `linkedMapOf`, `sortedMapOf`, all
# of which have an empty overload) so a project's own non-vararg function
# never loses its only argument:
#
#   * `_sole_typed_declaration`: the builder is the value of a property or
#     local whose declared type is `Map`, `MutableMap`, `HashMap`,
#     `LinkedHashMap` or `SortedMap` (nullable or not) with type arguments
#     and no `*` in them;
#   * `_sole_type_arguments`: the builder call carries its own type
#     arguments (`mutableMapOf<String, Boolean>(…)`);
#   * `_sole_for_testing_argument`: the builder is the first positional
#     argument of `FeatureflipClient.forTesting(…)`, whose parameter is a
#     non-generic `Map<String, …>` in both SDKs and is not overloaded.
#
# Any other sole entry is left in place and reported like any other kept
# entry. A general call argument is NOT on the list even where it would
# compile: the overload case above is one no query can see.
#
# REMOVING ONE OF SEVERAL ENTRIES CAN NARROW THE MAP'S TYPE, so an entry
# with another argument beside it is not deleted anywhere either. Measured
# with kotlinc 2.2.20: `val m = mutableMapOf("k" to true, "limit" to 5)` is
# a `MutableMap<String, {Comparable & Serializable}>`, and `m["x"] = false`
# compiles; without the flag's entry `m` is `MutableMap<String, Int>` and
# the assignment fails ("argument type mismatch"). A key does the same
# (`"k" to true, 1 to false` is keyed by `Any`). And a callee that is not a
# map builder may not take a vararg at all: `twoPairs("k" to true, "j" to
# false)` lost an argument. So the `_before` / `_after` rules are anchored
# on a standard-library builder too, and come in the three typed contexts
# above (`_typed_declaration`, `_nullable_typed_declaration`,
# `_type_arguments`, `_for_testing_argument`) plus one more:
#
#   * `_boolean_map`: anywhere, but only when EVERY argument of the call is
#     a plain string key `to` `true`/`false`, so the map is a
#     `Map<String, Boolean>` before and after. A `not_contains` filter
#     declines any `value_argument` whose TEXT is not exactly
#     `"<no quote, backslash or $>" to true|false`; judged by text because
#     this grammar has no boolean node, and a key that merely STARTS with a
#     string (`"x".length to false`) must not pass. Interpolated or escaped
#     keys, named and spread arguments and a comment inside an argument
#     decline it, which only ever keeps more.
#
# The registry prong has no `_boolean_map` rule: with every value a boolean
# literal and the value not `@untreated`, the value IS `@treated`, so the
# stub prong's `_boolean_map` already deletes it without sibling evidence.
#
# A mixed-value map under an unannotated `val`/`var`, `Any`, `Map<*, *>` or
# passed to another function keeps the entry, and so does a registry whose
# values are all integers or all strings (its type would not move, but a
# query cannot tell that from a mix, so booleans are the one case taken).
#
# "Has another argument beside it" is a pattern with an UNANCHORED sibling,
# `(value_arguments (value_argument …) @entry (value_argument))`, so a
# comment between the two does not matter. It is two rules, one per
# direction, because Piranha ANDs the patterns of a multi-pattern query.
# The registry prong's sibling filter runs `on_capture = "entry"`, so it
# resolves the entry's own argument list whatever node the rule is rooted
# at.
#
# STUB PRONG (`delete_flag_keyed_boolean_argument_*`) — the value is the
# boolean literal this run KEEPS: a test override, or a plain flag -> value
# map. This grammar parses `true`/`false` in this position as a plain
# `(identifier)` rather than as their own node types, so the value is named
# by TEXT, and the removed-branch guard above leaves one spelling to accept:
# whichever `@treated` holds.
#
# REGISTRY PRONG (`delete_flag_keyed_registry_argument_*`) — another
# argument in the SAME call is keyed by a different flag of this project, so
# the call builds a flag-keyed map. The evidence cannot be satisfied by the
# target's own key; sibling evidence inside the target's own VALUE is
# accepted, because `contains` searches the whole subtree and a nested flag
# map is still a flag map. So a sole entry that nests another flag key
# passes the filter, and is then deleted only in the three typed positions
# above, like any other sole entry.
#
# `@sibling_operator` rather than `@operator` in the filter, which is NOT
# cosmetic: a rule's own captures are in scope as substitutions inside its
# filters, so `@operator` there is rewritten to the matched text `to` before
# tree-sitter sees the query and the engine panics on `(identifier) to)`
# (measured). Any filter capture sharing a name with a capture in the rule
# query has the same problem.

[[rules]]
name = "delete_flag_keyed_boolean_argument_before_boolean_map"
query = """(
  (call_expression
    . (identifier) @builder
    (value_arguments
      (value_argument
        (infix_expression
          . (string_literal . (string_content) @flag_name .)
          . (identifier) @operator
          . (identifier) @value)) @entry
      (value_argument)))
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @operator "to")
  (#eq? @value "@treated")
  (#match? @builder "^(mapOf|mutableMapOf|hashMapOf|linkedMapOf|sortedMapOf)$")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "treated"]

[[rules.filters]]
on_capture = "entry"
enclosing_node = "(value_arguments) @map"
not_contains = ['''(
  (value_argument) @map_argument
  (#not-match? @map_argument "^\"[^\"\\\\$]*\"\\s+to\\s+(true|false)$")
)''']

[[rules]]
name = "delete_flag_keyed_boolean_argument_after_boolean_map"
query = """(
  (call_expression
    . (identifier) @builder
    (value_arguments
      (value_argument)
      (value_argument
        (infix_expression
          . (string_literal . (string_content) @flag_name .)
          . (identifier) @operator
          . (identifier) @value)) @entry))
  (#eq? @flag_name "@stale_flag_name")
  (#eq? @operator "to")
  (#eq? @value "@treated")
  (#match? @builder "^(mapOf|mutableMapOf|hashMapOf|linkedMapOf|sortedMapOf)$")
)"""
replace_node = "entry"
replace = ""
groups = ["delete_flag_keyed_entry"]
holes = ["stale_flag_name", "treated"]

[[rules.filters]]
